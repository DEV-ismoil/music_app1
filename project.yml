name: Groove
options:
  bundleIdPrefix: com.groove.native
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "16.0"
targets:
  Groove:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: WebAssets
        buildPhase: resources
        type: folder
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Groove
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIBackgroundModes:
          - audio
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groove.native
        PRODUCT_NAME: Groove
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
