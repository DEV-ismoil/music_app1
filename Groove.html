<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groove</title>
<style>
  :root{
    --bg: #14120F;
    --bg-panel: #1C1915;
    --bg-raised: #262119;
    --line: #33291E;
    --text: #ECE3D3;
    --text-dim: #9C8F7A;
    --accent: #C98A4B;
    --accent-dim: #7A5A34;
    --brass: #A9895A;
    --bg-glow: #201B14;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  body[data-theme="light"]{
    --bg:#F5F1E8; --bg-panel:#FFFFFF; --bg-raised:#F0EBDD; --line:#E1D9C8;
    --text:#2A2420; --text-dim:#8C8071; --accent:#B5652F; --accent-dim:#E3B98C; --brass:#B5652F;
    --bg-glow:#EFE7D6;
  }
  body[data-theme="matrix"]{
    --bg:#040604; --bg-panel:#060B06; --bg-raised:#0B140B; --line:#123312;
    --text:#B9FFC4; --text-dim:#4E9C5A; --accent:#00FF66; --accent-dim:#0C5C2A; --brass:#00CC55;
    --bg-glow:#04140A;
    --serif: var(--mono);
  }
  body[data-theme="galaxy"]{
    --bg:#0A0920; --bg-panel:#110E30; --bg-raised:#1A1544; --line:#2B2461;
    --text:#E9E5FF; --text-dim:#9089C6; --accent:#B98CFF; --accent-dim:#5D4B9C; --brass:#7FD9FF;
    --bg-glow:#160F3A;
  }
  body[data-theme="sunset"]{
    --bg:#241019; --bg-panel:#2E1420; --bg-raised:#3B1B2A; --line:#4C2334;
    --text:#FDEBDE; --text-dim:#C48D8F; --accent:#FF7A59; --accent-dim:#B85641; --brass:#FFB347;
    --bg-glow:#331222;
  }
  body[data-theme="ocean"]{
    --bg:#081820; --bg-panel:#0C2430; --bg-raised:#123240; --line:#1D4A5C;
    --text:#DFF4F7; --text-dim:#7FAAB8; --accent:#33B7C4; --accent-dim:#2A7E8A; --brass:#5FD3DD;
    --bg-glow:#0E3040;
  }
  body[data-theme="forest"]{
    --bg:#0F1710; --bg-panel:#152116; --bg-raised:#1C2E1D; --line:#2C4530;
    --text:#DCEFDA; --text-dim:#87A88A; --accent:#6FA85E; --accent-dim:#4C7A40; --brass:#9BC77E;
    --bg-glow:#182A18;
  }
  body[data-theme="cyberpunk"]{
    --bg:#0A0612; --bg-panel:#120A1E; --bg-raised:#1C0F30; --line:#3A1B58;
    --text:#F2E8FF; --text-dim:#9C7FC4; --accent:#FF2E9A; --accent-dim:#9C1E63; --brass:#00E5FF;
    --bg-glow:#1A0A2E;
  }
  body[data-theme="rosegold"]{
    --bg:#241A1C; --bg-panel:#2E2124; --bg-raised:#3A2A2D; --line:#4E3639;
    --text:#F8E7E2; --text-dim:#C39B94; --accent:#E8A798; --accent-dim:#B87A6D; --brass:#E3C08A;
    --bg-glow:#33232A;
  }
  body[data-theme="noir"]{
    --bg:#0A0A0A; --bg-panel:#121212; --bg-raised:#1B1B1B; --line:#2E2E2E;
    --text:#F2F2F2; --text-dim:#8A8A8A; --accent:#E8E8E8; --accent-dim:#5A5A5A; --brass:#CFCFCF;
    --bg-glow:#161616;
  }
  body[data-theme="coffee"]{
    --bg:#1C140F; --bg-panel:#251A13; --bg-raised:#2F2118; --line:#43301F;
    --text:#EFDFCB; --text-dim:#A98F72; --accent:#C08552; --accent-dim:#8A5C34; --brass:#D9A15C;
    --bg-glow:#28190F;
  }
  body[data-theme="ice"]{
    --bg:#EAF3F8; --bg-panel:#FFFFFF; --bg-raised:#E3EFF5; --line:#CBDFE9;
    --text:#1E3641; --text-dim:#6C93A3; --accent:#2E8FB0; --accent-dim:#A9D6E6; --brass:#2E8FB0;
    --bg-glow:#DCEEF5;
  }
  body[data-theme="lava"]{
    --bg:#150707; --bg-panel:#1F0A0A; --bg-raised:#2B0E0D; --line:#4A1610;
    --text:#FCE3D6; --text-dim:#B87A63; --accent:#FF4A23; --accent-dim:#B22E13; --brass:#FF9142;
    --bg-glow:#260C0A;
  }
  body[data-theme="amber"]{
    --bg:#0C0900; --bg-panel:#151000; --bg-raised:#1E1700; --line:#3A2C00;
    --text:#FFD98A; --text-dim:#B08A3E; --accent:#FFB000; --accent-dim:#B37D00; --brass:#FFC94D;
    --bg-glow:#1A1300;
    --serif: var(--mono);
  }
  body[data-theme="pastel"]{
    --bg:#F3EEFA; --bg-panel:#FFFFFF; --bg-raised:#ECE4F7; --line:#DCCDF0;
    --text:#4A3B5C; --text-dim:#9C87B5; --accent:#B48CE0; --accent-dim:#D9C4F0; --brass:#F0A8C8;
    --bg-glow:#EBE1F7;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(1200px 800px at 20% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    overflow:hidden;
    transition: background .3s, color .3s;
  }
  ::selection{ background: var(--accent-dim); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  #fxCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:0;
    pointer-events:none;
  }

  .app{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns: 340px 1fr;
    height:100vh;
    transition: grid-template-columns .2s;
  }

  /* ---------- LIBRARY (left) ---------- */
  .library{
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
    transition: background .3s, border-color .3s;
  }
  .library-head{
    padding: 22px 20px 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .brand .accent-dot{ color: var(--accent); }
  .sub{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .search-row{
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .search-row input{
    width:100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--sans);
    outline:none;
  }
  .search-row input:focus{ border-color: var(--accent-dim); }
  .search-row input::placeholder{ color: var(--text-dim); }

  .add-row{
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    display:flex;
    gap:8px;
  }
  .btn{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text);
    padding: 9px 14px;
    cursor:pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover{ border-color: var(--accent-dim); color: var(--text); }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #1A1109;
  }
  .btn.primary:hover{ filter: brightness(1.08); }
  .add-row .btn{ flex:1; }

  .track-list{
    flex:1;
    overflow-y:auto;
    padding: 6px 0 20px 0;
  }
  .track-row{
    display:grid;
    grid-template-columns: 26px 1fr auto 26px;
    align-items:center;
    gap: 10px;
    padding: 10px 20px;
    cursor:pointer;
    border-left: 2px solid transparent;
    border-top: 2px solid transparent;
  }
  .track-row[draggable="true"]{ cursor: grab; }
  .track-row.dragging{ opacity: 0.35; }
  .track-row.drag-over{ border-top-color: var(--accent); }
  .track-row:hover{ background: rgba(127,127,127,0.08); }
  .track-row.active{
    background: rgba(201,138,75,0.12);
    border-left-color: var(--accent);
  }
  .track-num{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align:right;
  }
  .track-row.active .track-num{ color: var(--accent); }
  .track-meta{ min-width:0; }
  .track-title{
    font-size: 13.5px;
    color: var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-artist{
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-dur{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .track-del{
    opacity:0;
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    font-size: 15px;
    line-height:1;
  }
  .track-row:hover .track-del{ opacity:1; }
  .track-del:hover{ color: #D9694C; }

  .empty-lib{
    padding: 40px 24px;
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    line-height:1.6;
  }
  .empty-lib b{ color: var(--text); }

  /* ---------- STAGE (right) ---------- */
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px;
    min-width:0;
  }

  .stage-toolbar{
    position:absolute;
    top:22px;
    right:26px;
    display:flex;
    gap:8px;
    z-index:5;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--bg-raised);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent-dim); }
  .icon-btn.active{ color:var(--accent); border-color:var(--accent-dim); }
  .icon-btn svg{ width:16px;height:16px; }

  .popover{
    position:absolute;
    top:64px;
    right:26px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    min-width:190px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    display:none;
    z-index:10;
  }
  .popover.open{ display:block; }
  .popover-title{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .swatch-grid{ display:flex; flex-direction:column; gap:4px; max-height:340px; overflow-y:auto; padding-right:2px; }
  .theme-swatch{
    display:flex; align-items:center; gap:9px;
    background:none;border:1px solid transparent;border-radius:6px;
    padding:7px 8px;
    color:var(--text);
    font-size:12.5px;
    font-family:var(--sans);
    cursor:pointer;
    text-align:left;
  }
  .theme-swatch:hover{ background:var(--bg-raised); }
  .theme-swatch.active{ border-color:var(--accent-dim); background:var(--bg-raised); }
  .swatch-dot{ width:12px;height:12px;border-radius:50%; display:inline-block; flex-shrink:0; }

  .eq-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .eq-row:last-child{ margin-bottom:0; }
  .eq-row label{ width:42px; font-size:11px; color:var(--text-dim); font-family:var(--mono); }
  .eq-row input[type=range]{ flex:1; accent-color: var(--accent); }

  .sleep-options{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .sleep-options button{
    flex:1 1 40%;
    padding:7px 0;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--bg-raised);
    color:var(--text);
    font-size:12px;
    font-family:var(--sans);
    cursor:pointer;
  }
  .sleep-options button:hover{ border-color:var(--accent-dim); }
  .sleep-status{ font-family:var(--mono); font-size:11px; color:var(--accent); text-align:center; min-height:14px; }

  .disc-wrap{
    position:relative;
    width: 300px;
    height: 300px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .disc{
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #0E0C0A 0px, #0E0C0A 2px,
        #17140F 3px, #17140F 5px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin 9s linear infinite paused;
  }
  .disc.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .label{
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), #8A5B2E);
    background-size: cover;
    background-position: center;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    box-shadow: 0 0 0 2px #0E0C0A, inset 0 2px 6px rgba(255,255,255,0.15);
    padding: 14px;
    overflow:hidden;
  }
  .label.has-art{ padding:0; }
  .label-text{
    font-family: var(--serif);
    font-weight: bold;
    color: #1A1109;
    line-height: 1.15;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .label-artist{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(26,17,9,0.75);
    margin-top: 5px;
  }
  .spindle{
    position:absolute;
    width: 10px; height:10px;
    border-radius:50%;
    background:#0A0908;
    box-shadow: 0 0 0 2px #2A2419;
  }

  .now-playing{
    margin-top: 30px;
    text-align:center;
    max-width: 480px;
  }
  .np-title{
    font-family: var(--serif);
    font-size: 24px;
    color: var(--text);
  }
  .np-artist{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform:uppercase;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .progress-wrap{
    width: 460px;
    max-width: 80vw;
    margin-top: 26px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .time{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 38px;
  }
  .time.right{ text-align:right; }
  .bar{
    flex:1;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    position:relative;
    cursor:pointer;
  }
  .bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    background: var(--accent);
    border-radius: 2px;
    width:0%;
  }
  .bar-knob{
    position:absolute;
    top:50%;
    width:11px; height:11px;
    background: var(--text);
    border-radius:50%;
    transform: translate(-50%,-50%);
    left:0%;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.3);
  }

  .controls{
    margin-top: 26px;
    display:flex;
    align-items:center;
    gap: 22px;
  }
  .ctl-btn{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: color .15s, transform .1s;
  }
  .ctl-btn:hover{ color: var(--text); }
  .ctl-btn:active{ transform: scale(0.92); }
  .ctl-btn.toggled{ color: var(--accent); }
  .ctl-btn svg{ width:18px; height:18px; }
  .play-btn{
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #1A1109;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px -6px rgba(201,138,75,0.6);
  }
  .play-btn:hover{ filter: brightness(1.08); color:#1A1109; }
  .play-btn svg{ width:20px; height:20px; }

  .volume-row{
    margin-top: 22px;
    display:flex;
    align-items:center;
    gap: 10px;
    color: var(--text-dim);
  }
  .volume-row svg{ width:15px; height:15px; }
  .vol-bar{
    width: 100px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    position:relative;
    cursor:pointer;
  }
  .vol-fill{
    position:absolute; left:0; top:0; bottom:0;
    background: var(--brass);
    border-radius: 2px;
    width: 70%;
  }

  .hint{
    position:absolute;
    bottom: 22px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    opacity: 0.6;
  }

  input[type=file]{ display:none; }

  /* ---------- MINI PLAYER MODE ---------- */
  body.mini-mode .library{ display:none; }
  body.mini-mode .app{ grid-template-columns: 1fr; }
  body.mini-mode .stage{ padding:16px; }
  body.mini-mode .disc-wrap{ width:120px; height:120px; }
  body.mini-mode .disc{ width:110px; height:110px; }
  body.mini-mode .label{ width:64px; height:64px; padding:6px; }
  body.mini-mode .label-text{ font-size:9px !important; -webkit-line-clamp:3; }
  body.mini-mode .label-artist{ display:none; }
  body.mini-mode .now-playing{ margin-top:12px; max-width:260px; }
  body.mini-mode .np-title{ font-size:15px; }
  body.mini-mode .np-artist{ font-size:9px; margin-top:3px; }
  body.mini-mode .progress-wrap{ width:230px; margin-top:12px; }
  body.mini-mode .controls{ margin-top:12px; gap:14px; }
  body.mini-mode .play-btn{ width:42px; height:42px; }
  body.mini-mode .volume-row{ margin-top:10px; }
  body.mini-mode .hint{ display:none; }
  body.mini-mode .stage-toolbar{ top:10px; right:10px; }
  body.mini-mode .popover{ top:48px; right:10px; }

  @media (max-width: 720px){
    .app{ grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    .library{ border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div class="app">

  <!-- LIBRARY -->
  <div class="library">
    <div class="library-head">
      <div class="brand">Groove<span class="accent-dot">.</span></div>
      <div class="sub">your music, offline, no ads</div>
    </div>
    <div class="search-row">
      <input id="search" type="text" placeholder="Search your library…">
    </div>
    <div class="add-row">
      <button class="btn primary" id="addBtn">+ Add music files</button>
      <button class="btn" id="clearBtn" title="Remove everything">Clear</button>
    </div>
    <input type="file" id="fileInput" accept="audio/*" multiple>
    <div class="track-list" id="trackList"></div>
  </div>

  <!-- STAGE -->
  <div class="stage">

    <div class="stage-toolbar">
      <button class="icon-btn" id="themeBtn" title="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.4-.3-.4-.5-.9-.5-1.4 0-1.1.9-2 2-2h2.5c1.7 0 3-1.3 3-3A10 10 0 0 0 12 2z"></path><circle cx="7.5" cy="10.5" r="1.1"></circle><circle cx="11" cy="7" r="1.1"></circle><circle cx="15.5" cy="8.5" r="1.1"></circle></svg>
      </button>
      <button class="icon-btn" id="eqBtn" title="Equalizer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
      </button>

<script>
(function(){
  // ---------- IndexedDB storage ----------
  const DB_NAME = 'groove-player';
  const DB_VERSION = 2;
  const STORE = 'tracks';
  const SETTINGS_STORE = 'settings';
  let db;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)){
          d.createObjectStore(STORE, { keyPath: 'id' });
        }
        if(!d.objectStoreNames.contains(SETTINGS_STORE)){
          d.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e);
    });
  }

  function dbAll(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const store = tx.objectStore(STORE);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e);
    });
  }
  function dbPut(track){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(track);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }
  function dbDelete(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }
  function dbClear(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }
  function dbGetSetting(key){
    return new Promise((resolve) => {
      try{
        const tx = db.transaction(SETTINGS_STORE, 'readonly');
        const req = tx.objectStore(SETTINGS_STORE).get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
        req.onerror = () => resolve(undefined);
      }catch(e){ resolve(undefined); }
    });
  }
  function dbSetSetting(key, value){
    return new Promise((resolve) => {
      try{
        const tx = db.transaction(SETTINGS_STORE, 'readwrite');
        tx.objectStore(SETTINGS_STORE).put({ key, value });
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      }catch(e){ resolve(); }
    });
  }

  // ---------- App state ----------
  let library = [];
  let filtered = [];
  let currentIndex = -1;
  let isPlaying = false;
  let isShuffle = false;
  let repeatMode = 0; // 0 off, 1 all, 2 one
  let objectUrl = null;
  let artObjectUrl = null;
  let dragId = null;
  const savedEq = { bass: 0, mid: 0, treble: 0 };

  const audio = new Audio();
  audio.volume = 0.7;

  const trackListEl = document.getElementById('trackList');
  const searchEl = document.getElementById('search');
  const fileInput = document.getElementById('fileInput');
  const addBtn = document.getElementById('addBtn');
  const clearBtn = document.getElementById('clearBtn');
  const npTitle = document.getElementById('npTitle');
  const npArtist = document.getElementById('npArtist');
  const disc = document.getElementById('disc');
  const discLabel = document.getElementById('discLabel');
  const discText = document.getElementById('discText');
  const discArtist = document.getElementById('discArtist');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const bar = document.getElementById('bar');
  const barFill = document.getElementById('barFill');
  const barKnob = document.getElementById('barKnob');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const volBar = document.getElementById('volBar');
  const volFill = document.getElementById('volFill');

  const themeBtn = document.getElementById('themeBtn');
  const eqBtn = document.getElementById('eqBtn');
  const sleepBtn = document.getElementById('sleepBtn');
  const miniBtn = document.getElementById('miniBtn');
  const themePanel = document.getElementById('themePanel');
  const eqPanel = document.getElementById('eqPanel');
  const sleepPanel = document.getElementById('sleepPanel');
  const eqBassEl = document.getElementById('eqBass');
  const eqMidEl = document.getElementById('eqMid');
  const eqTrebleEl = document.getElementById('eqTreble');
  const sleepStatus = document.getElementById('sleepStatus');

  const PLAY_SVG = '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
  const PAUSE_SVG = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function guessArtistTitle(filename){
    let name = filename.replace(/\.[^/.]+$/, '');
    let parts = name.split(' - ');
    if(parts.length >= 2){
      return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
    }
    return { artist: 'Unknown artist', title: name.trim() };
  }

  // ---------- Album art (ID3v2 APIC extraction, mp3 files) ----------
  async function extractAlbumArt(file){
    try{
      const buf = await file.slice(0, 3 * 1024 * 1024).arrayBuffer();
      const view = new DataView(buf);
      if(buf.byteLength < 10) return null;
      if(view.getUint8(0) !== 0x49 || view.getUint8(1) !== 0x44 || view.getUint8(2) !== 0x33) return null; // "ID3"
      const verMajor = view.getUint8(3);
      const tagSize = ((view.getUint8(6)&0x7f)<<21) | ((view.getUint8(7)&0x7f)<<14) | ((view.getUint8(8)&0x7f)<<7) | (view.getUint8(9)&0x7f);
      let offset = 10;
      const tagEnd = Math.min(10 + tagSize, buf.byteLength);

      while(offset < tagEnd - 10){
        const frameId = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
        let frameSize;
        if(verMajor >= 4){
          frameSize = ((view.getUint8(offset+4)&0x7f)<<21) | ((view.getUint8(offset+5)&0x7f)<<14) | ((view.getUint8(offset+6)&0x7f)<<7) | (view.getUint8(offset+7)&0x7f);
        } else {
          frameSize = (view.getUint8(offset+4)<<24) | (view.getUint8(offset+5)<<16) | (view.getUint8(offset+6)<<8) | (view.getUint8(offset+7));
        }
        if(frameSize <= 0 || offset + 10 + frameSize > buf.byteLength) break;

        if(frameId === 'APIC'){
          let p = offset + 10;
          const frameEnd = p + frameSize;
          const encoding = view.getUint8(p); p += 1;
          let mimeEnd = p;
          while(mimeEnd < frameEnd && view.getUint8(mimeEnd) !== 0) mimeEnd++;
          const mime = new TextDecoder('iso-8859-1').decode(new Uint8Array(buf, p, mimeEnd - p));
          p = mimeEnd + 1;
          p += 1; // picture type byte
          if(encoding === 1 || encoding === 2){
            while(p < frameEnd - 1 && !(view.getUint8(p) === 0 && view.getUint8(p+1) === 0)) p += 2;
            p += 2;
          } else {
            while(p < frameEnd && view.getUint8(p) !== 0) p++;
            p += 1;
          }
          if(p >= frameEnd) return null;
          const imgData = buf.slice(p, frameEnd);
          const mimeType = (mime && mime.toLowerCase().startsWith('image')) ? mime : 'image/jpeg';
          return new Blob([imgData], { type: mimeType });
        }
        offset += 10 + frameSize;
      }
      return null;
    }catch(e){
      return null;
    }
  }

  window.__test_extractAlbumArt = extractAlbumArt; // exposed for automated testing/debugging only

  function setDiscVisual(t){
    if(artObjectUrl){ URL.revokeObjectURL(artObjectUrl); artObjectUrl = null; }
    if(t && t.art){
      artObjectUrl = URL.createObjectURL(t.art);
      discLabel.style.backgroundImage = `url(${artObjectUrl})`;
      discLabel.classList.add('has-art');
      discText.style.display = 'none';
      discArtist.style.display = 'none';
    } else {
      discLabel.style.backgroundImage = 'none';
      discLabel.classList.remove('has-art');
      discText.style.display = '';
      discArtist.style.display = '';
      const title = t ? t.title : 'Groove';
      const artist = t ? t.artist : '';
      discText.textContent = title;
      discArtist.textContent = artist;
      const len = title.length;
      let size = 20;
      if(len > 10) size = 17;
      if(len > 18) size = 14;
      if(len > 28) size = 12;
      if(len > 40) size = 10.5;
      discText.style.fontSize = size + 'px';
    }
  }

  // ---------- Rendering ----------
  function render(){
    const q = searchEl.value.trim().toLowerCase();
    filtered = library.filter(t =>
      !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
    );
    const canDrag = filtered.length === library.length;

    if(library.length === 0){
      trackListEl.innerHTML = `<div class="empty-lib">
        <b>Your library is empty.</b><br><br>
        Click <b>+ Add music files</b> and pick songs you own from your computer.
        They'll be saved here permanently — no need to re-add them next time.
      </div>`;
      return;
    }

    trackListEl.innerHTML = filtered.map((t, i) => {
      const activeClass = (t.id === (library[currentIndex] && library[currentIndex].id)) ? 'active' : '';
      return `<div class="track-row ${activeClass}" data-id="${t.id}" draggable="${canDrag}">
        <div class="track-num">${i+1}</div>
        <div class="track-meta">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-artist">${escapeHtml(t.artist)}</div>
        </div>
        <div class="track-dur">${t.duration ? fmtTime(t.duration) : ''}</div>
        <button class="track-del" data-del="${t.id}" title="Remove">✕</button>
      </div>`;
    }).join('');
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Playback ----------
  function libIndexOf(id){ return library.findIndex(t => t.id === id); }

  function loadTrack(idx, autoplay){
    if(idx < 0 || idx >= library.length) return;
    currentIndex = idx;
    const t = library[idx];
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(t.blob);
    audio.src = objectUrl;
    npTitle.textContent = t.title;
    npArtist.textContent = t.artist;
    setDiscVisual(t);
    render();
    if(autoplay){
      ensureAudioGraph();
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().catch(()=>{});
    }
  }

  function play(){
    ensureAudioGraph();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if(currentIndex === -1 && library.length > 0){
      loadTrack(0, true);
      return;
    }
    audio.play().catch(()=>{});
  }
  function pause(){ audio.pause(); }

  function playNext(auto){
    if(library.length === 0) return;
    let idx;
    if(isShuffle){
      idx = Math.floor(Math.random() * library.length);
    } else {
      idx = currentIndex + 1;
      if(idx >= library.length){
        if(repeatMode === 1) idx = 0;
        else { if(auto){ pause(); } return; }
      }
    }
    loadTrack(idx, true);
  }
  function playPrev(){
    if(library.length === 0) return;
    let idx = currentIndex - 1;
    if(idx < 0) idx = library.length - 1;
    loadTrack(idx, true);
  }

  audio.addEventListener('play', () => {
    isPlaying = true;
    disc.classList.add('spinning');
    playIcon.innerHTML = PAUSE_SVG;
  });
  audio.addEventListener('pause', () => {
    isPlaying = false;
    disc.classList.remove('spinning');
    playIcon.innerHTML = PLAY_SVG;
  });
  audio.addEventListener('timeupdate', () => {
    if(!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    barFill.style.width = pct + '%';
    barKnob.style.left = pct + '%';
    curTime.textContent = fmtTime(audio.currentTime);
    durTime.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', () => {
    if(repeatMode === 2){
      audio.currentTime = 0;
      audio.play();
    } else {
      playNext(true);
    }
  });

  // ---------- Equalizer ----------
  let audioCtx = null, eqSource = null, bassFilter = null, midFilter = null, trebleFilter = null, eqConnected = false;

  function ensureAudioGraph(){
    if(eqConnected) return;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      eqSource = audioCtx.createMediaElementSource(audio);
      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 120; bassFilter.gain.value = savedEq.bass;
      midFilter = audioCtx.createBiquadFilter();
      midFilter.type = 'peaking'; midFilter.frequency.value = 1000; midFilter.Q.value = 0.9; midFilter.gain.value = savedEq.mid;
      trebleFilter = audioCtx.createBiquadFilter();
      trebleFilter.type = 'highshelf'; trebleFilter.frequency.value = 8000; trebleFilter.gain.value = savedEq.treble;
      eqSource.connect(bassFilter);
      bassFilter.connect(midFilter);
      midFilter.connect(trebleFilter);
      trebleFilter.connect(audioCtx.destination);
      eqConnected = true;
    }catch(e){
      console.error('Equalizer init failed', e);
    }
  }

  eqBassEl.addEventListener('input', () => {
    savedEq.bass = parseFloat(eqBassEl.value);
    if(bassFilter) bassFilter.gain.value = savedEq.bass;
    dbSetSetting('eqBass', savedEq.bass);
  });
  eqMidEl.addEventListener('input', () => {
    savedEq.mid = parseFloat(eqMidEl.value);
    if(midFilter) midFilter.gain.value = savedEq.mid;
    dbSetSetting('eqMid', savedEq.mid);
  });
  eqTrebleEl.addEventListener('input', () => {
    savedEq.treble = parseFloat(eqTrebleEl.value);
    if(trebleFilter) trebleFilter.gain.value = savedEq.treble;
    dbSetSetting('eqTreble', savedEq.treble);
  });

  // ---------- Sleep timer ----------
  let sleepTimeout = null, sleepInterval = null, sleepEndAt = null;

  function clearSleepTimer(){
    if(sleepTimeout) clearTimeout(sleepTimeout);
    if(sleepInterval) clearInterval(sleepInterval);
    sleepTimeout = null; sleepInterval = null; sleepEndAt = null;
    sleepStatus.textContent = '';
    sleepBtn.classList.remove('active');
  }
  function updateSleepDisplay(){
    if(!sleepEndAt) return;
    const remain = Math.max(0, sleepEndAt - Date.now());
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    sleepStatus.textContent = `Pausing in ${m}:${s.toString().padStart(2,'0')}`;
  }
  function setSleepTimer(minutes){
    clearSleepTimer();
    if(!minutes) return;
    sleepEndAt = Date.now() + minutes * 60000;
    sleepBtn.classList.add('active');
    updateSleepDisplay();
    sleepInterval = setInterval(updateSleepDisplay, 1000);
    sleepTimeout = setTimeout(() => { pause(); clearSleepTimer(); }, minutes * 60000);
  }

  document.querySelectorAll('.sleep-options button').forEach(btn => {
    btn.addEventListener('click', () => {
      const min = parseInt(btn.dataset.min, 10);
      if(min > 0) setSleepTimer(min); else clearSleepTimer();
      closeAllPopovers();
    });
  });

  // ---------- Themes ----------
  const fxCanvas = document.getElementById('fxCanvas');
  const fxCtx = fxCanvas.getContext('2d');
  let fxRAF = null;

  function resizeCanvas(){
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function stopFx(){
    if(fxRAF) cancelAnimationFrame(fxRAF);
    fxRAF = null;
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }

  function startMatrixRain(){
    stopFx();
    const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const fontSize = 15;
    let columns = Math.floor(fxCanvas.width / fontSize);
    let drops = new Array(columns).fill(0).map(() => Math.random() * -50);
    function draw(){
      fxCtx.fillStyle = 'rgba(2,4,2,0.09)';
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      fxCtx.fillStyle = '#00FF66';
      fxCtx.font = fontSize + 'px monospace';
      for(let i = 0; i < drops.length; i++){
        const ch = chars[Math.floor(Math.random() * chars.length)];
        fxCtx.fillText(ch, i * fontSize, drops[i] * fontSize);
        if(drops[i] * fontSize > fxCanvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  function startGalaxyStars(){
    stopFx();
    const stars = [];
    for(let i = 0; i < 140; i++){
      stars.push({ x: Math.random()*fxCanvas.width, y: Math.random()*fxCanvas.height, r: Math.random()*1.3+0.2, a: Math.random() });
    }
    let shooting = [];
    let frame = 0;
    function spawnShooting(){
      shooting.push({
        x: Math.random() * fxCanvas.width * 0.7,
        y: Math.random() * fxCanvas.height * 0.3,
        len: 80 + Math.random()*100,
        speed: 8 + Math.random()*6,
        angle: Math.PI/4 + (Math.random()*0.2 - 0.1),
        life: 0,
        maxLife: 40 + Math.random()*20
      });
    }
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      stars.forEach(s => {
        s.a += (Math.random()-0.5)*0.05;
        s.a = Math.max(0.2, Math.min(1, s.a));
        fxCtx.beginPath();
        fxCtx.fillStyle = `rgba(255,255,255,${s.a})`;
        fxCtx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        fxCtx.fill();
      });
      frame++;
      if(frame % 90 === 0 && Math.random() > 0.3) spawnShooting();
      shooting.forEach(st => {
        st.life++;
        st.x += Math.cos(st.angle) * st.speed;
        st.y += Math.sin(st.angle) * st.speed;
        const tailX = st.x - Math.cos(st.angle) * st.len;
        const tailY = st.y - Math.sin(st.angle) * st.len;
        const grad = fxCtx.createLinearGradient(st.x, st.y, tailX, tailY);
        grad.addColorStop(0, 'rgba(255,255,255,0.9)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        fxCtx.strokeStyle = grad;
        fxCtx.lineWidth = 2;
        fxCtx.beginPath();
        fxCtx.moveTo(st.x, st.y);
        fxCtx.lineTo(tailX, tailY);
        fxCtx.stroke();
      });
      shooting = shooting.filter(st => st.life < st.maxLife);
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  function applyTheme(theme){
    document.body.setAttribute('data-theme', theme);
    if(theme === 'matrix') startMatrixRain();
    else if(theme === 'galaxy') startGalaxyStars();
    else stopFx();
    dbSetSetting('theme', theme);
    document.querySelectorAll('.theme-swatch').forEach(el => {
      el.classList.toggle('active', el.dataset.theme === theme);
    });
  }

  document.querySelectorAll('.theme-swatch').forEach(btn => {
    btn.addEventListener('click', () => { applyTheme(btn.dataset.theme); closeAllPopovers(); });
  });

  // ---------- Toolbar popovers ----------
  function closeAllPopovers(){
    document.querySelectorAll('.popover').forEach(p => p.classList.remove('open'));
  }
  function togglePopover(el){
    const isOpen = el.classList.contains('open');
    closeAllPopovers();
    if(!isOpen) el.classList.add('open');
  }
  themeBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePopover(themePanel); });
  eqBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePopover(eqPanel); });
  sleepBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePopover(sleepPanel); });
  document.addEventListener('click', () => closeAllPopovers());
  document.querySelectorAll('.popover').forEach(p => p.addEventListener('click', e => e.stopPropagation()));

  // ---------- Mini player mode ----------
  function applyMini(mini){
    document.body.classList.toggle('mini-mode', mini);
    miniBtn.classList.toggle('active', mini);
    miniBtn.title = mini ? 'Exit mini player' : 'Mini player';
    try{
      if(window.pywebview && window.pywebview.api){
        if(mini && window.pywebview.api.enter_mini) window.pywebview.api.enter_mini();
        if(!mini && window.pywebview.api.exit_mini) window.pywebview.api.exit_mini();
      }
    }catch(e){}
  }
  miniBtn.addEventListener('click', () => applyMini(!document.body.classList.contains('mini-mode')));

  // ---------- Controls ----------
  playBtn.addEventListener('click', () => isPlaying ? pause() : play());
  nextBtn.addEventListener('click', () => playNext(false));
  prevBtn.addEventListener('click', playPrev);
  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('toggled', isShuffle);
  });
  repeatBtn.addEventListener('click', () => {
    repeatMode = (repeatMode + 1) % 3;
    repeatBtn.classList.toggle('toggled', repeatMode !== 0);
    repeatBtn.style.opacity = repeatMode === 2 ? '0.7' : '1';
    repeatBtn.title = repeatMode === 0 ? 'Repeat off' : repeatMode === 1 ? 'Repeat all' : 'Repeat one';
  });

  bar.addEventListener('click', (e) => {
    if(!audio.duration) return;
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  volBar.addEventListener('click', (e) => {
    const rect = volBar.getBoundingClientRect();
    let pct = (e.clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    audio.volume = pct;
    volFill.style.width = (pct*100) + '%';
    dbSetSetting('volume', pct);
  });

  trackListEl.addEventListener('dblclick', (e) => {
    const row = e.target.closest('.track-row');
    if(!row) return;
    const id = row.dataset.id;
    const idx = libIndexOf(id);
    if(idx !== -1) loadTrack(idx, true);
  });

  trackListEl.addEventListener('click', (e) => {
    const del = e.target.closest('[data-del]');
    if(del){
      const id = del.dataset.del;
      removeTrack(id);
    }
  });

  searchEl.addEventListener('input', render);

  // ---------- Drag to reorder ----------
  trackListEl.addEventListener('dragstart', (e) => {
    const row = e.target.closest('.track-row');
    if(!row || row.getAttribute('draggable') !== 'true') return;
    dragId = row.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => row.classList.add('dragging'), 0);
  });
  trackListEl.addEventListener('dragend', (e) => {
    const row = e.target.closest('.track-row');
    if(row) row.classList.remove('dragging');
    document.querySelectorAll('.track-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    dragId = null;
  });
  trackListEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    const row = e.target.closest('.track-row');
    if(!row || !dragId) return;
    document.querySelectorAll('.track-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    row.classList.add('drag-over');
  });
  trackListEl.addEventListener('drop', async (e) => {
    e.preventDefault();
    const row = e.target.closest('.track-row');
    document.querySelectorAll('.track-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    if(!row || !dragId) return;
    const targetId = row.dataset.id;
    if(targetId === dragId) return;
    const fromIdx = library.findIndex(t => t.id === dragId);
    const toIdx = library.findIndex(t => t.id === targetId);
    if(fromIdx === -1 || toIdx === -1) return;
    const [moved] = library.splice(fromIdx, 1);
    library.splice(toIdx, 0, moved);
    for(let i = 0; i < library.length; i++){
      library[i].order = i;
      await dbPut(library[i]);
    }
    render();
  });

  // ---------- Adding / removing files ----------
  addBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => addFiles(e.target.files));

  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    if(e.dataTransfer.files && e.dataTransfer.files.length){
      addFiles(e.dataTransfer.files);
    }
  });

  async function addFiles(fileList){
    for(const file of fileList){
      if(!file.type.startsWith('audio/')) continue;
      const { artist, title } = guessArtistTitle(file.name);
      const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,9);
      const order = library.length;
      const track = { id, name: file.name, artist, title, blob: file, duration: null, order, art: null };

      library.push(track);
      render();
      await dbPut(track);

      const tempUrl = URL.createObjectURL(file);
      const tempAudio = new Audio(tempUrl);
      tempAudio.addEventListener('loadedmetadata', async () => {
        track.duration = tempAudio.duration;
        URL.revokeObjectURL(tempUrl);
        await dbPut(track);
        render();
      });

      extractAlbumArt(file).then(async (artBlob) => {
        if(artBlob){
          track.art = artBlob;
          await dbPut(track);
          if(library[currentIndex] && library[currentIndex].id === track.id){
            setDiscVisual(track);
          }
        }
      });
    }
    fileInput.value = '';
  }

  async function removeTrack(id){
    const idx = libIndexOf(id);
    if(idx === -1) return;
    if(idx === currentIndex){
      audio.pause();
      audio.src = '';
      currentIndex = -1;
      npTitle.textContent = 'Nothing loaded yet';
      npArtist.textContent = 'ADD SOME MUSIC TO BEGIN';
      setDiscVisual(null);
    } else if(idx < currentIndex){
      currentIndex--;
    }
    library.splice(idx, 1);
    await dbDelete(id);
    render();
  }

  clearBtn.addEventListener('click', async () => {
    if(library.length === 0) return;
    if(!confirm('Remove all songs from your library? This cannot be undone.')) return;
    audio.pause();
    audio.src = '';
    currentIndex = -1;
    library = [];
    await dbClear();
    npTitle.textContent = 'Nothing loaded yet';
    npArtist.textContent = 'ADD SOME MUSIC TO BEGIN';
    setDiscVisual(null);
    render();
  });

  // ---------- Keyboard shortcuts ----------
  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); isPlaying ? pause() : play(); }
    if(e.code === 'ArrowRight' && e.shiftKey){ playNext(false); }
    if(e.code === 'ArrowLeft' && e.shiftKey){ playPrev(); }
  });

  // ---------- Init ----------
  (async function init(){
    try{
      db = await openDB();
      library = await dbAll();

      let needsMigration = false;
      library.forEach((t, i) => {
        if(typeof t.order !== 'number'){ t.order = i; needsMigration = true; }
        if(t.art === undefined){ t.art = null; }
      });
      if(needsMigration){ for(const t of library) await dbPut(t); }
      library.sort((a,b) => a.order - b.order);

      const savedTheme = await dbGetSetting('theme');
      applyTheme(savedTheme || 'vinyl');

      const savedVol = await dbGetSetting('volume');
      if(typeof savedVol === 'number'){
        audio.volume = savedVol;
        volFill.style.width = (savedVol*100) + '%';
      } else {
        volFill.style.width = (audio.volume*100) + '%';
      }

      savedEq.bass = (await dbGetSetting('eqBass')) ?? 0;
      savedEq.mid = (await dbGetSetting('eqMid')) ?? 0;
      savedEq.treble = (await dbGetSetting('eqTreble')) ?? 0;
      eqBassEl.value = savedEq.bass;
      eqMidEl.value = savedEq.mid;
      eqTrebleEl.value = savedEq.treble;
    } catch(err){
      console.error('Storage error', err);
      applyTheme('vinyl');
      volFill.style.width = (audio.volume*100) + '%';
    }
    render();
  })();

})();
</script>
</body>
</html>
