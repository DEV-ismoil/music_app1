  /* ---- album-art background layer (used by glitch/glass/ambient/duotone/polaroid/noiredge) ---- */
  .album-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition: opacity .4s ease;
    pointer-events:none;
  }
  #albumTint{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0;
    pointer-events:none;
    transition: opacity .4s ease;
  }
  .polaroid-card{
    position:fixed;
    top:14%;
    left:50%;
    width:220px;
    padding:14px 14px 40px 14px;
    background:#F4EFE6;
    border-radius:3px;
    box-shadow:0 25px 50px -15px rgba(0,0,0,0.6);
    transform:translateX(-50%) rotate(-4deg);
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
    z-index:0;
  }
  .polaroid-card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:#333;
  }

  body[data-theme="glitch"] .album-bg{ opacity:0.55; filter:saturate(1.3) contrast(1.1); }
  body[data-theme="glitch"] .album-bg::before,
  body[data-theme="glitch"] .album-bg::after{
    content:'';
    position:absolute; inset:0;
    background-image:inherit;
    background-size:cover;
    background-position:center;
    mix-blend-mode:screen;
  }
  body[data-theme="glitch"] .album-bg::before{
    filter: hue-rotate(90deg) saturate(2);
    animation: glitchShiftA 2.4s steps(2) infinite;
  }
  body[data-theme="glitch"] .album-bg::after{
    filter: hue-rotate(-90deg) saturate(2);
    animation: glitchShiftB 3.1s steps(2) infinite;
  }
  body[data-theme="glitch"]::after{
    content:'';
    position:fixed; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 2px, transparent 3px);
    pointer-events:none;
    z-index:0;
    mix-blend-mode:overlay;
  }
  @keyframes glitchShiftA{
    0%,100%{ clip-path: inset(20% 0 60% 0); transform:translateX(-6px); }
    25%{ clip-path: inset(45% 0 30% 0); transform:translateX(8px); }
    50%{ clip-path: inset(10% 0 75% 0); transform:translateX(-10px); }
    75%{ clip-path: inset(60% 0 15% 0); transform:translateX(4px); }
  }
  @keyframes glitchShiftB{
    0%,100%{ clip-path: inset(65% 0 10% 0); transform:translateX(6px); }
    30%{ clip-path: inset(5% 0 80% 0); transform:translateX(-8px); }
    60%{ clip-path: inset(40% 0 35% 0); transform:translateX(10px); }
    85%{ clip-path: inset(70% 0 5% 0); transform:translateX(-4px); }
  }

  body[data-theme="glass"] .album-bg{ opacity:0.55; filter: blur(45px) saturate(1.4) brightness(0.7); transform:scale(1.15); }

  body[data-theme="ambient"] .album-bg{ opacity:0.6; filter: blur(65px) saturate(1.3) brightness(0.65); transform:scale(1.2); animation: ambientBreathe 12s ease-in-out infinite; }
  @keyframes ambientBreathe{
    0%,100%{ transform:scale(1.2); }
    50%{ transform:scale(1.32); }
  }

  body[data-theme="duotone"] .album-bg{ opacity:0.5; filter: grayscale(1) contrast(1.3); }
  body[data-theme="duotone"] #albumTint{ opacity:0.55; background:var(--accent); mix-blend-mode:color; }

  body[data-theme="polaroid"] .album-bg{ opacity:0.35; filter: blur(50px) brightness(0.55); transform:scale(1.2); }
  body[data-theme="polaroid"] .polaroid-card{ opacity:1; }

  body[data-theme="noiredge"] .album-bg{ opacity:0.4; filter: grayscale(1) contrast(1.9) brightness(0.85); mix-blend-mode:screen; }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(1200px 800px at 20% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    overflow:hidden;
    transition: background .3s, color .3s;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  ::selection{ background: var(--accent-dim); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  #fxCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:0;
    pointer-events:none;
  }

  .app{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns: 340px 1fr;
    height:100vh;
    transition: grid-template-columns .2s;
  }

  /* ---------- LIBRARY (left) ---------- */
  .library{
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    transition: background .3s, border-color .3s;
  }
  .library-head{
    padding: 22px 20px 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .brand .accent-dot{ color: var(--accent); }
  .sub{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .search-row{
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .search-row input{
    width:100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--sans);
    outline:none;
  }
  .search-row input:focus{ border-color: var(--accent-dim); }
  .search-row input::placeholder{ color: var(--text-dim); }

  .add-row{
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    display:flex;
    gap:8px;
  }
  .btn{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text);
    padding: 9px 14px;
    cursor:pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover{ border-color: var(--accent-dim); color: var(--text); }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #1A1109;
  }
  .btn.primary:hover{ filter: brightness(1.08); }
  .add-row .btn{ flex:1; }

  .playlist-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
  }
  .playlist-chip{
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .playlist-chip:hover{ color: var(--text); border-color: var(--accent-dim); }
  .playlist-chip.active{ background: var(--accent); border-color: var(--accent); color: #1A1109; }
  .playlist-chip.playlist-add{ padding: 6px 10px; font-weight: 700; }
  #newPlaylistInput{
    background: var(--bg-raised);
    border: 1px solid var(--accent-dim);
    color: var(--text);
    border-radius: 14px;
    padding: 6px 11px;
    font-size: 11.5px;
    width: 130px;
  }
  .playlist-add-btn{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    font-size: 13px;
    opacity:0.6;
    padding: 4px;
  }
  .track-row:hover .playlist-add-btn{ opacity:1; }
  .playlist-add-btn:hover{ color: var(--accent); }
  .playlist-picker{
    position:absolute;
    background: var(--bg-panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px;
    min-width:150px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    z-index:20;
  }
  .playlist-picker button{
    display:flex; align-items:center; gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--text);
    font-size:12px;
    padding:7px 8px;
    border-radius:5px;
    cursor:pointer;
  }
  .playlist-picker button:hover{ background:var(--bg-raised); }
  .playlist-picker .pl-check{ width:14px; display:inline-block; color:var(--accent); }

  .track-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding: 6px 0 20px 0;
  }
  .track-row{
    display:grid;
    grid-template-columns: 16px 24px 1fr auto 22px 22px;
    align-items:center;
    gap: 8px;
    padding: 10px 20px;
    cursor:pointer;
    border-left: 2px solid transparent;
    border-top: 2px solid transparent;
  }
  .drag-handle{
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1;
    text-align: center;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    opacity: 0.45;
    padding: 6px 0;
  }
  .track-row:hover .drag-handle{ opacity: 0.9; }
  .drag-handle:active{ cursor: grabbing; }
  .track-row.dragging{ opacity: 0.35; }
  .track-row.drag-over{ border-top-color: var(--accent); }
  .track-row:hover{ background: rgba(127,127,127,0.08); }
  .track-row.active{
    background: rgba(201,138,75,0.12);
    border-left-color: var(--accent);
  }
  .track-num{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align:right;
  }
  .track-row.active .track-num{ color: var(--accent); }
  .track-meta{ min-width:0; }
  .track-title{
    font-size: 13.5px;
    color: var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-artist{
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-dur{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .track-del{
    opacity:0;
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    font-size: 15px;
    line-height:1;
  }
  .track-row:hover .track-del{ opacity:1; }
  .track-del:hover{ color: #D9694C; }

  .empty-lib{
    padding: 40px 24px;
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    line-height:1.6;
  }
  .empty-lib b{ color: var(--text); }

  /* ---------- STAGE (right) ---------- */
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px;
    min-width:0;
  }

  .stage-toolbar{
    position:absolute;
    top:22px;
    right:26px;
    display:flex;
    gap:8px;
    z-index:5;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--bg-raised);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent-dim); }
  .icon-btn.active{ color:var(--accent); border-color:var(--accent-dim); }
  .icon-btn svg{ width:16px;height:16px; }

  .popover{
    position:absolute;
    top:64px;
    right:26px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    min-width:190px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    display:none;
    z-index:10;
  }
  .popover.open{ display:block; }
  .popover-title{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .swatch-grid{ display:flex; flex-direction:column; gap:4px; max-height:340px; overflow-y:auto; padding-right:2px; }
  .theme-swatch{
    display:flex; align-items:center; gap:9px;
    background:none;border:1px solid transparent;border-radius:6px;
    padding:7px 8px;
    color:var(--text);
    font-size:12.5px;
    font-family:var(--sans);
    cursor:pointer;
    text-align:left;
  }
  .theme-swatch:hover{ background:var(--bg-raised); }
  .theme-swatch.active{ border-color:var(--accent-dim); background:var(--bg-raised); }
  .swatch-dot{ width:12px;height:12px;border-radius:50%; display:inline-block; flex-shrink:0; }
  .swatch-group-label{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 8px 2px 8px;
    opacity: 0.7;
  }

  .eq-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  #eqPanel{ max-height: 360px; overflow-y: auto; min-width: 220px; }
  .eq-row:last-child{ margin-bottom:0; }
  .eq-row label{ width:42px; font-size:11px; color:var(--text-dim); font-family:var(--mono); }
  .eq-row input[type=range]{ flex:1; accent-color: var(--accent); }

  .sleep-options{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .sleep-options button{
    flex:1 1 40%;
    padding:7px 0;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--bg-raised);
    color:var(--text);
    font-size:12px;
    font-family:var(--sans);
    cursor:pointer;
  }
  .sleep-options button:hover{ border-color:var(--accent-dim); }
  .sleep-status{ font-family:var(--mono); font-size:11px; color:var(--accent); text-align:center; min-height:14px; }

  .turntable{
    position:relative;
    width: 400px;
    height: 360px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .3s;
  }
  #vizCanvas{
    display:none;
    width: 400px;
    height: 360px;
  }
  body.viz-on .turntable{ display:none; }
  body.viz-on #vizCanvas{ display:block; }
  .plinth{
    position:absolute;
    width: 380px;
    height: 330px;
    top: 6px;
    left: 10px;
    border-radius: 14px;
    background: linear-gradient(160deg, #3A2E20 0%, #211809 55%, #150E06 100%);
    box-shadow:
      0 35px 70px -25px rgba(0,0,0,0.75),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -3px 8px rgba(0,0,0,0.5);
  }
  .plinth::before{
    content:'';
    position:absolute;
    inset: 10px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events:none;
  }
  .platter-mat{
    position:absolute;
    width: 306px;
    height: 306px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #050403 0%, #0C0A08 70%, #050403 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), inset 0 10px 30px rgba(0,0,0,0.6);
  }
  .disc-wrap{
    position:relative;
    width: 300px;
    height: 300px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .disc{
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #0E0C0A 0px, #0E0C0A 2px,
        #17140F 3px, #17140F 5px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin 9s linear infinite paused;
  }
  .disc.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .label{
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), #8A5B2E);
    background-size: cover;
    background-position: center;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    box-shadow: 0 0 0 2px #0E0C0A, inset 0 2px 6px rgba(255,255,255,0.15);
    padding: 14px;
    overflow:hidden;
  }
  .label.has-art{ padding:0; }
  .label-text{
    font-family: var(--serif);
    font-weight: bold;
    color: #1A1109;
    line-height: 1.15;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .label-artist{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(26,17,9,0.75);
    margin-top: 5px;
  }
  .spindle{
    position:absolute;
    width: 10px; height:10px;
    border-radius:50%;
    background:#0A0908;
    box-shadow: 0 0 0 2px #2A2419;
    z-index:4;
  }

  /* ---------- tonearm ---------- */
  .tonearm-base{
    position:absolute;
    top: 26px;
    right: 26px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4A3D2A, #17130A 75%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.15);
    z-index: 6;
  }
  .tonearm{
    position:absolute;
    top: 37px;
    right: 37px;
    width: 150px;
    height: 10px;
    transform-origin: 6px 4px;
    transform: rotate(-30deg);
    transition: transform 0.35s ease-out;
    z-index: 6;
    pointer-events:none;
  }
  .tonearm-shaft{
    position:absolute;
    left: 4px; top: 3px;
    width: 128px; height: 4px;
    background: linear-gradient(90deg, #D9B87A, #8a7248);
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .headshell{
    position:absolute;
    left: 124px; top: -5px;
    width: 20px; height: 14px;
    background: linear-gradient(160deg, #2A2A2A, #0E0E0E);
    border-radius: 2px 5px 5px 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .headshell::after{
    content:'';
    position:absolute;
    right: -2px; top: 5px;
    width: 4px; height: 6px;
    background: #C98A4B;
    border-radius: 1px;
  }

  @keyframes turntableSpin{ to{ transform: rotate(360deg); } }

  /* ---- turntable material themes ---- */
  body[data-theme="wood"] .plinth{
    background:
      repeating-linear-gradient(100deg, #6B4A2E 0px, #7C5636 10px, #5A3D24 20px, #6B4A2E 30px),
      linear-gradient(160deg, #6B4A2E, #3D2814);
    background-blend-mode: multiply;
  }
  body[data-theme="chrome"] .plinth{
    background: linear-gradient(160deg, #E8ECEF 0%, #9AA3A8 40%, #4A5054 70%, #C8D3D8 100%);
  }
  body[data-theme="chrome"] .tonearm-shaft{ background: linear-gradient(90deg, #E8ECEF, #9AA3A8); }
  body[data-theme="marble"] .plinth{
    background:
      radial-gradient(circle at 20% 30%, rgba(120,120,110,0.18), transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(120,120,110,0.14), transparent 45%),
      linear-gradient(160deg, #F5F3EE, #DAD5C9);
    box-shadow: 0 35px 70px -25px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  body[data-theme="neoncyber"] .plinth{
    background: linear-gradient(160deg, #14101F, #0A0714);
    box-shadow: 0 0 0 1px #00F0FF66, 0 0 30px 4px #00F0FF44, 0 35px 70px -25px rgba(0,0,0,0.8);
  }
  body[data-theme="neoncyber"] .tonearm-shaft{ background: linear-gradient(90deg, #00F0FF, #FF2ED0); }
  body[data-theme="roseturn"] .plinth{
    background: linear-gradient(160deg, #E8B4BC 0%, #B8636E 50%, #8C4650 100%);
  }
  body[data-theme="carbon"] .plinth{
    background:
      repeating-linear-gradient(45deg, #161616 0px, #161616 4px, #0A0A0A 4px, #0A0A0A 8px),
      repeating-linear-gradient(-45deg, rgba(26,26,26,0.35) 0px, rgba(26,26,26,0.35) 4px, transparent 4px, transparent 8px);
  }

  .now-playing{
    margin-top: 30px;
    text-align:center;
    max-width: 480px;
  }
  .np-title{
    font-family: var(--serif);
    font-size: 24px;
    color: var(--text);
  }
  .np-artist{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform:uppercase;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .progress-wrap{
    width: 460px;
    max-width: 80vw;
    margin-top: 26px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .time{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 38px;
  }
  .time.right{ text-align:right; }
  .bar{
    flex:1;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    position:relative;
    cursor:pointer;
    transition: height .2s;
  }
  .bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    background: var(--accent);
    border-radius: 2px;
    width:0%;
  }
  .bar-knob{
    position:absolute;
    top:50%;
    width:11px; height:11px;
    background: var(--text);
    border-radius:50%;
    transform: translate(-50%,-50%);
    left:0%;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.3);
    transition: left .1s linear;
  }
  #barCanvas{
    display:none;
    position:absolute;
    left:0; top:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  /* ---- full-bar progress styles: hide the plain fill/knob, show canvas, give it room ---- */
  body[data-progress="lightspeed"] .bar,
  body[data-progress="water"] .bar,
  body[data-progress="wave"] .bar,
  body[data-progress="neonpulse"] .bar,
  body[data-progress="groove"] .bar{
    height: 16px;
  }
  body[data-progress="lightspeed"] .bar-fill, body[data-progress="lightspeed"] .bar-knob,
  body[data-progress="water"] .bar-fill, body[data-progress="water"] .bar-knob,
  body[data-progress="wave"] .bar-fill, body[data-progress="wave"] .bar-knob,
  body[data-progress="neonpulse"] .bar-fill, body[data-progress="neonpulse"] .bar-knob,
  body[data-progress="groove"] .bar-fill, body[data-progress="groove"] .bar-knob{
    display:none;
  }
  body[data-progress="lightspeed"] #barCanvas,
  body[data-progress="water"] #barCanvas,
  body[data-progress="wave"] #barCanvas,
  body[data-progress="neonpulse"] #barCanvas,
  body[data-progress="groove"] #barCanvas{
    display:block;
  }

  .controls{
    margin-top: 26px;
    display:flex;
    align-items:center;
    gap: 22px;
  }
  .ctl-btn{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: color .15s, transform .1s;
  }
  .ctl-btn:hover{ color: var(--text); }
  .ctl-btn:active{ transform: scale(0.92); }
  .ctl-btn.toggled{ color: var(--accent); }
  .ctl-btn svg{ width:18px; height:18px; }
  .play-btn{
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #1A1109;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px -6px rgba(201,138,75,0.6);
  }
  .play-btn:hover{ filter: brightness(1.08); color:#1A1109; }
  .play-btn svg{ width:20px; height:20px; }

  .volume-row{
    margin-top: 22px;
    display:flex;
    align-items:center;
    gap: 10px;
    color: var(--text-dim);
  }
  .volume-row svg{ width:15px; height:15px; }
  .vol-bar{
    width: 100px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    position:relative;
    cursor:pointer;
  }
  .vol-fill{
    position:absolute; left:0; top:0; bottom:0;
    background: var(--brass);
    border-radius: 2px;
    width: 70%;
  }

  .hint{
    position:absolute;
    bottom: 22px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    opacity: 0.6;
  }

  input[type=file]{ display:none; }

  /* ---------- MINI PLAYER MODE ---------- */
  body.mini-mode .library{ display:none; }
  body.mini-mode .app{ grid-template-columns: 1fr; }
  body.mini-mode .stage{ padding:10px; }
  body.mini-mode .turntable{ width:78px; height:78px; }
  body.mini-mode .plinth, body.mini-mode .platter-mat, body.mini-mode .tonearm-base, body.mini-mode .tonearm{ display:none; }
  body.mini-mode .disc-wrap{ width:78px; height:78px; }
  body.mini-mode .disc{ width:72px; height:72px; }
  body.mini-mode .label{ width:40px; height:40px; padding:4px; }
  body.mini-mode .label-text{ font-size:7px !important; -webkit-line-clamp:2; }
  body.mini-mode .label-artist{ display:none; }
  body.mini-mode .now-playing{ margin-top:8px; max-width:220px; }
  body.mini-mode .np-title{ font-size:13px; }
  body.mini-mode .np-artist{ font-size:8px; margin-top:2px; }
  body.mini-mode .progress-wrap{ width:210px; margin-top:8px; }
  body.mini-mode .controls{ margin-top:8px; gap:12px; }
  body.mini-mode .play-btn{ width:38px; height:38px; }
  body.mini-mode .volume-row{ margin-top:8px; }
  body.mini-mode .vol-bar{ width:70px; }
  body.mini-mode .hint{ display:none; }
  /* Only the restore button stays visible — everything else (themes, EQ,
     sleep timer, etc.) is hidden to keep mini mode small and simple. */
  body.mini-mode .stage-toolbar > *:not(#miniBtn){ display:none; }
  body.mini-mode .stage-toolbar{ top:8px; right:8px; }
  body.mini-mode #vizCanvas{ display:none !important; }
  body.mini-mode .turntable{ display: flex !important; }

  @media (max-width: 720px){
    .app{ grid-template-columns: 1fr; grid-template-rows: minmax(240px, 46vh) 1fr; height: 100vh; height: 100dvh; }
    .library{ border-right:none; border-bottom:1px solid var(--line); }
    .library-head{ padding: 12px 16px 8px 16px; }
    .brand{ font-size: 18px; }
    .sub{ font-size: 9px; margin-top: 2px; }
    .search-row{ padding: 8px 16px; }
    .search-row input{ padding: 7px 10px; font-size: 12.5px; }
    .add-row{ padding: 8px 16px; gap: 6px; }
    .btn{ padding: 7px 10px; font-size: 12px; }
    .track-row{ padding: 8px 16px; }
  }

  @media (max-width: 480px){
    .stage{ padding: 20px 16px; }
    .turntable{ width: 260px; height: 234px; }
    .plinth{ width: 246px; height: 214px; left: 7px; }
    .platter-mat{ width: 198px; height: 198px; }
    .disc-wrap{ width: 194px; height: 194px; }
    .disc{ width: 180px; height: 180px; }
    .label{ width: 108px; height: 108px; padding: 10px; }
    .label-text{ font-size: 14px !important; }
    .tonearm-base{ top: 18px; right: 18px; width: 20px; height: 20px; }
    .tonearm{ top: 27px; right: 27px; width: 110px; }
    .tonearm-shaft{ width: 92px; }
    .headshell{ left: 88px; }
    .now-playing{ margin-top: 18px; }
    .np-title{ font-size: 19px; }
    .progress-wrap{ width: 100%; margin-top: 18px; }
    .controls{ margin-top: 18px; gap: 16px; }
    .stage-toolbar{ top: 14px; right: 14px; gap: 6px; }
    .icon-btn{ width: 30px; height: 30px; }
    .popover{ top: 54px; right: 14px; left: 14px; min-width: 0; }
    .hint{ display: none; }
  }
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>
<div class="album-bg" id="albumBg"></div>
<div id="albumTint"></div>
<div class="polaroid-card" id="polaroidCard"><img id="polaroidImg" alt=""></div>

<div class="app">

  <!-- LIBRARY -->
  <div class="library">
    <div class="library-head">
      <div class="brand">Groove<span class="accent-dot">.</span></div>
      <div class="sub">your music, offline, no ads</div>
    </div>
    <div class="search-row">
      <input id="search" type="text" placeholder="Search your library…">
    </div>
    <div class="add-row">
      <button class="btn primary" id="addBtn">+ Add music files</button>
      <button class="btn" id="clearBtn" title="Remove everything">Clear</button>
    </div>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple inputmode="file" style="display:none;">
    <div class="playlist-row" id="playlistRow">
      <button class="playlist-chip active" data-playlist="" id="allSongsChip">All Songs</button>
      <button class="playlist-chip playlist-add" id="newPlaylistChip" title="New playlist">+</button>
      <input type="text" id="newPlaylistInput" placeholder="Playlist name…" style="display:none;">
    </div>
    <div class="track-list" id="trackList"></div>
  </div>

  <!-- STAGE -->
  <div class="stage">

(function(){
  // ---------- IndexedDB storage ----------
  const DB_NAME = 'groove-player';
  const DB_VERSION = 3;
  const STORE = 'tracks';
  const SETTINGS_STORE = 'settings';
  const PLAYLIST_STORE = 'playlists';
  let db;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)){
          d.createObjectStore(STORE, { keyPath: 'id' });
        }
        if(!d.objectStoreNames.contains(SETTINGS_STORE)){
          d.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
        }
        if(!d.objectStoreNames.contains(PLAYLIST_STORE)){
          d.createObjectStore(PLAYLIST_STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e);
    });
  }

  function dbAllPlaylists(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(PLAYLIST_STORE, 'readonly');
      const req = tx.objectStore(PLAYLIST_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e);
    });
  }
  function dbPutPlaylist(pl){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(PLAYLIST_STORE, 'readwrite');
      tx.objectStore(PLAYLIST_STORE).put(pl);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }
  function dbDeletePlaylist(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(PLAYLIST_STORE, 'readwrite');
      tx.objectStore(PLAYLIST_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }

  function dbAll(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const store = tx.objectStore(STORE);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e);
    });
  }
  function dbPut(track){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    const req = store.put(track);
    
    req.onsuccess = () => resolve();
    req.onerror = (e) => reject(e);
  });
}
  function dbDelete(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }
  function dbClear(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }
  function dbGetSetting(key){
    return new Promise((resolve) => {
      try{
        const tx = db.transaction(SETTINGS_STORE, 'readonly');
        const req = tx.objectStore(SETTINGS_STORE).get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
        req.onerror = () => resolve(undefined);
      }catch(e){ resolve(undefined); }
    });
  }
  function dbSetSetting(key, value){
    return new Promise((resolve) => {
      try{
        const tx = db.transaction(SETTINGS_STORE, 'readwrite');
        tx.objectStore(SETTINGS_STORE).put({ key, value });
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      }catch(e){ resolve(); }
    });
  }

  // ---------- App state ----------
  let library = [];
  let filtered = [];

  let isShuffle = false;

  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function guessArtistTitle(filename){
    let name = filename.replace(/\.[^/.]+$/, '');
    let parts = name.split(' - ');
    if(parts.length >= 2){
      return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
    }
    return { artist: 'Unknown artist', title: name.trim() };
  }

  // ---------- Album art (ID3v2 APIC extraction, mp3 files) ----------
  async function extractAlbumArt(file){
    try{
      const buf = await file.slice(0, 3 * 1024 * 1024).arrayBuffer();
      const view = new DataView(buf);
      if(buf.byteLength < 10) return null;
      if(view.getUint8(0) !== 0x49 || view.getUint8(1) !== 0x44 || view.getUint8(2) !== 0x33) return null; // "ID3"
      const verMajor = view.getUint8(3);
      const tagSize = ((view.getUint8(6)&0x7f)<<21) | ((view.getUint8(7)&0x7f)<<14) | ((view.getUint8(8)&0x7f)<<7) | (view.getUint8(9)&0x7f);
      let offset = 10;
      const tagEnd = Math.min(10 + tagSize, buf.byteLength);

      while(offset < tagEnd - 10){
        const frameId = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
        let frameSize;
        if(verMajor >= 4){
          frameSize = ((view.getUint8(offset+4)&0x7f)<<21) | ((view.getUint8(offset+5)&0x7f)<<14) | ((view.getUint8(offset+6)&0x7f)<<7) | (view.getUint8(offset+7)&0x7f);
        } else {
          frameSize = (view.getUint8(offset+4)<<24) | (view.getUint8(offset+5)<<16) | (view.getUint8(offset+6)<<8) | (view.getUint8(offset+7));
        }
        if(frameSize <= 0 || offset + 10 + frameSize > buf.byteLength) break;

        if(frameId === 'APIC'){
          let p = offset + 10;
          const frameEnd = p + frameSize;
          const encoding = view.getUint8(p); p += 1;
          let mimeEnd = p;
          while(mimeEnd < frameEnd && view.getUint8(mimeEnd) !== 0) mimeEnd++;
          const mime = new TextDecoder('iso-8859-1').decode(new Uint8Array(buf, p, mimeEnd - p));
          p = mimeEnd + 1;
          p += 1; // picture type byte
          if(encoding === 1 || encoding === 2){
            while(p < frameEnd - 1 && !(view.getUint8(p) === 0 && view.getUint8(p+1) === 0)) p += 2;
            p += 2;
          } else {
            while(p < frameEnd && view.getUint8(p) !== 0) p++;
            p += 1;
          }
          if(p >= frameEnd) return null;
          const imgData = buf.slice(p, frameEnd);
          const mimeType = (mime && mime.toLowerCase().startsWith('image')) ? mime : 'image/jpeg';
          return new Blob([imgData], { type: mimeType });
        }
        offset += 10 + frameSize;
      }
      return null;
    }catch(e){
      return null;
    }
  }

  window.__test_extractAlbumArt = extractAlbumArt; // exposed for automated testing/debugging only

  function decodeId3String(bytes, encoding){
    try{
      if(encoding === 0){
        return new TextDecoder('iso-8859-1').decode(bytes).replace(/\u0000+$/,'').trim();
      } else if(encoding === 3){
        return new TextDecoder('utf-8').decode(bytes).replace(/\u0000+$/,'').trim();
      } else if(encoding === 2){
        return new TextDecoder('utf-16be').decode(bytes).replace(/\u0000+$/,'').trim();
      } else {
        // encoding 1: UTF-16 with BOM (defaults to LE if no/garbled BOM)
        return new TextDecoder('utf-16le').decode(bytes).replace(/^\ufeff/,'').replace(/\u0000+$/,'').trim();
      }
    }catch(e){
      return '';
    }
  }

  // Reads the TIT2 (title) and TPE1 (artist) text frames from an ID3v2 tag,
  // so real tagged metadata is used instead of guessing from the filename.
  async function extractId3Tags(file){
    try{
      const buf = await file.slice(0, 1 * 1024 * 1024).arrayBuffer();
      const view = new DataView(buf);
      if(buf.byteLength < 10) return {};
      if(view.getUint8(0) !== 0x49 || view.getUint8(1) !== 0x44 || view.getUint8(2) !== 0x33) return {};
      const verMajor = view.getUint8(3);
      const tagSize = ((view.getUint8(6)&0x7f)<<21) | ((view.getUint8(7)&0x7f)<<14) | ((view.getUint8(8)&0x7f)<<7) | (view.getUint8(9)&0x7f);
      let offset = 10;
      const tagEnd = Math.min(10 + tagSize, buf.byteLength);
      const result = {};

      while(offset < tagEnd - 10){
        const frameId = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
        let frameSize;
        if(verMajor >= 4){
          frameSize = ((view.getUint8(offset+4)&0x7f)<<21) | ((view.getUint8(offset+5)&0x7f)<<14) | ((view.getUint8(offset+6)&0x7f)<<7) | (view.getUint8(offset+7)&0x7f);
        } else {
          frameSize = (view.getUint8(offset+4)<<24) | (view.getUint8(offset+5)<<16) | (view.getUint8(offset+6)<<8) | (view.getUint8(offset+7));
        }
        if(frameSize <= 0 || offset + 10 + frameSize > buf.byteLength) break;

        if((frameId === 'TIT2' || frameId === 'TPE1') && frameSize >= 1){
          const encoding = view.getUint8(offset + 10);
          const strBytes = new Uint8Array(buf, offset + 11, frameSize - 1);
          const text = decodeId3String(strBytes, encoding);
          if(text){
            if(frameId === 'TIT2') result.title = text;
            if(frameId === 'TPE1') result.artist = text;
          }
        }
        offset += 10 + frameSize;
        if(result.title && result.artist) break;
      }
      return result;
    }catch(e){
      return {};
    }
  }

  window.__test_extractId3Tags = extractId3Tags; // exposed for automated testing/debugging only

  // Reads the USLT (unsynchronized lyrics) frame from an ID3v2 tag, if present.
  async function extractLyrics(file){
    try{
      const buf = await file.slice(0, 2 * 1024 * 1024).arrayBuffer();
      const view = new DataView(buf);
      if(buf.byteLength < 10) return null;
      if(view.getUint8(0) !== 0x49 || view.getUint8(1) !== 0x44 || view.getUint8(2) !== 0x33) return null;
      const verMajor = view.getUint8(3);
      const tagSize = ((view.getUint8(6)&0x7f)<<21) | ((view.getUint8(7)&0x7f)<<14) | ((view.getUint8(8)&0x7f)<<7) | (view.getUint8(9)&0x7f);
      let offset = 10;
      const tagEnd = Math.min(10 + tagSize, buf.byteLength);

      while(offset < tagEnd - 10){
        const frameId = String.fromCharCode(view.getUint8(offset), view.getUint8(offset+1), view.getUint8(offset+2), view.getUint8(offset+3));
        let frameSize;
        if(verMajor >= 4){
          frameSize = ((view.getUint8(offset+4)&0x7f)<<21) | ((view.getUint8(offset+5)&0x7f)<<14) | ((view.getUint8(offset+6)&0x7f)<<7) | (view.getUint8(offset+7)&0x7f);
        } else {
          frameSize = (view.getUint8(offset+4)<<24) | (view.getUint8(offset+5)<<16) | (view.getUint8(offset+6)<<8) | (view.getUint8(offset+7));
        }
        if(frameSize <= 0 || offset + 10 + frameSize > buf.byteLength) break;

        if(frameId === 'USLT' && frameSize >= 5){
          let p = offset + 10;
          const frameEnd = p + frameSize;
          const encoding = view.getUint8(p); p += 1;
          p += 3; // language code
          // short description, terminated per encoding
          if(encoding === 1 || encoding === 2){
            while(p < frameEnd - 1 && !(view.getUint8(p) === 0 && view.getUint8(p+1) === 0)) p += 2;
            p += 2;
          } else {
            while(p < frameEnd && view.getUint8(p) !== 0) p++;
            p += 1;
          }
          if(p >= frameEnd) return null;
          const textBytes = new Uint8Array(buf, p, frameEnd - p);
          const text = decodeId3String(textBytes, encoding);
          return text || null;
        }
        offset += 10 + frameSize;
      }
      return null;
    }catch(e){
      return null;
    }
  }

  function setDiscVisual(t){
    if(artObjectUrl){ URL.revokeObjectURL(artObjectUrl); artObjectUrl = null; }
    if(t && t.art){
      artObjectUrl = URL.createObjectURL(t.art);
      discLabel.style.backgroundImage = `url(${artObjectUrl})`;
      discLabel.classList.add('has-art');
      discText.style.display = 'none';
      discArtist.style.display = 'none';
      albumBg.style.backgroundImage = `url(${artObjectUrl})`;
      polaroidImg.src = artObjectUrl;
    } else {
      discLabel.style.backgroundImage = 'none';
      discLabel.classList.remove('has-art');
      discText.style.display = '';
      discArtist.style.display = '';
      albumBg.style.backgroundImage = 'none';
      polaroidImg.src = '';
      const title = t ? t.title : 'Groove';
      const artist = t ? t.artist : '';
      discText.textContent = title;
      discArtist.textContent = artist;
      const len = title.length;
      let size = 20;
      if(len > 10) size = 17;
      if(len > 18) size = 14;
      if(len > 28) size = 12;
      if(len > 40) size = 10.5;
      discText.style.fontSize = size + 'px';
    }
  }

  // ---------- Rendering ----------
  function getSourceList(){
    if(currentPlaylistId === null) return library;
    const pl = playlists.find(p => p.id === currentPlaylistId);
    if(!pl) return library;
    return pl.trackIds.map(id => library.find(t => t.id === id)).filter(Boolean);
  }

  function render(){
    const q = searchEl.value.trim().toLowerCase();
    const sourceList = getSourceList();
    filtered = sourceList.filter(t =>
      !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
    );
    const canDrag = filtered.length === sourceList.length;

    if(sourceList.length === 0){
      trackListEl.innerHTML = currentPlaylistId === null
        ? `<div class="empty-lib">
            <b>Your library is empty.</b><br><br>
            Click <b>+ Add music files</b> and pick songs you own from your computer.
            They'll be saved here permanently — no need to re-add them next time.
          </div>`
        : `<div class="empty-lib">
            <b>This playlist is empty.</b><br><br>
            Go to <b>All Songs</b> and use the <b>+</b> button on a track to add it here.
          </div>`;
      return;
    }

    trackListEl.innerHTML = filtered.map((t, i) => {
      const activeClass = (t.id === (library[currentIndex] && library[currentIndex].id)) ? 'active' : '';
      return `<div class="track-row ${activeClass}" data-id="${t.id}" data-draggable="${canDrag}">
        <div class="drag-handle" style="${canDrag ? '' : 'visibility:hidden;'}" title="Drag to reorder">⠿</div>
        <div class="track-num">${i+1}</div>
        <div class="track-meta">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-artist">${escapeHtml(t.artist)}</div>
        </div>
        <div class="track-dur">${t.duration ? fmtTime(t.duration) : ''}</div>
        <button class="playlist-add-btn" data-addpl="${t.id}" title="Add to playlist">+</button>
        <button class="track-del" data-del="${t.id}" title="${currentPlaylistId === null ? 'Remove from library' : 'Remove from playlist'}">✕</button>
      </div>`;
    }).join('');
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Playback ----------
  function libIndexOf(id){ return library.findIndex(t => t.id === id); }

  function setElementSource(el, track){
    if(el._objectUrl) URL.revokeObjectURL(el._objectUrl);
    el._objectUrl = URL.createObjectURL(track.blob);
    el.src = el._objectUrl;
  }

  function gainNodeFor(el){ return el === audioA ? gainA : gainB; }

  function cancelCrossfade(){
    if(crossfadeTimeout){ clearTimeout(crossfadeTimeout); crossfadeTimeout = null; }
    if(isCrossfading){
      standbyAudio.pause();
      if(audioCtx){
        const now = audioCtx.currentTime;
        if(gainNodeFor(audio)){ gainNodeFor(audio).gain.cancelScheduledValues(now); gainNodeFor(audio).gain.value = 1; }
        if(gainNodeFor(standbyAudio)){ gainNodeFor(standbyAudio).gain.cancelScheduledValues(now); gainNodeFor(standbyAudio).gain.value = 1; }
      }
    }
    isCrossfading = false;
  }

  function loadTrack(idx, autoplay){
    if(idx < 0 || idx >= library.length) return;
    cancelCrossfade();
    currentIndex = idx;
    const t = library[idx];
    setElementSource(audio, t);
    audio.currentTime = 0;
    currentBarPct = 0;
    barFill.style.width = '0%';
    barKnob.style.left = '0%';
    npTitle.textContent = t.title;
    npArtist.textContent = t.artist;
    setDiscVisual(t);
    updateMediaSessionMetadata(t);
    render();
    if(autoplay){
      ensureAudioGraph();
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().catch(()=>{});
    }
  }

  // ---------- Media Session (iOS/Android lock-screen controls + lets
  // background/locked-screen playback keep going, since the OS now knows
  // this page is legitimately playing media the user controls) ----------
  let mediaSessionArtUrl = null;
  function updateMediaSessionMetadata(t){
    if(!('mediaSession' in navigator)) return;
    try{
      const artwork = [];
      if(t.art){
        if(mediaSessionArtUrl) URL.revokeObjectURL(mediaSessionArtUrl);
        mediaSessionArtUrl = URL.createObjectURL(t.art);
        artwork.push(
          { src: mediaSessionArtUrl, sizes: '96x96',   type: t.art.type || 'image/jpeg' },
          { src: mediaSessionArtUrl, sizes: '192x192', type: t.art.type || 'image/jpeg' },
          { src: mediaSessionArtUrl, sizes: '512x512', type: t.art.type || 'image/jpeg' }
        );
      }
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title || 'Groove',
        artist: t.artist || '',
        album: 'Groove',
        artwork
      });
    }catch(e){ /* non-critical */ }
  }
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play', () => play());
      navigator.mediaSession.setActionHandler('pause', () => pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
      navigator.mediaSession.setActionHandler('nexttrack', () => playNext(false));
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if(details && typeof details.seekTime === 'number' && audio.duration){
          audio.currentTime = details.seekTime;
        }
      });
    }catch(e){ /* some actions may be unsupported on some browsers, ignore */ }
  }
  // If iOS suspends the underlying AudioContext while backgrounded/locked,
  // try to resume it the moment the page becomes visible/active again.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && audioCtx && audioCtx.state === 'suspended' && isPlaying){
      audioCtx.resume().catch(() => {});
    }
  });

  function play(){
    ensureAudioGraph();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if(currentIndex === -1 && library.length > 0){
      loadTrack(0, true);
      return;
    }
    audio.play().catch(()=>{});
  }
  function pause(){ audio.pause(); }

  function playNext(auto){
    if(library.length === 0) return;
    let idx;
    if(isShuffle){
      idx = Math.floor(Math.random() * library.length);
    } else {
      idx = currentIndex + 1;
      if(idx >= library.length){
        if(repeatMode === 1) idx = 0;
        else { if(auto){ pause(); } return; }
      }
    }
    loadTrack(idx, true);
  }
  function playPrev(){
    if(library.length === 0) return;
    let idx = currentIndex - 1;
    if(idx < 0) idx = library.length - 1;
    loadTrack(idx, true);
  }

  function beginCrossfade(){
    if(library.length < 2 || isCrossfading) return;
    let nextIdx;
    if(isShuffle){
      nextIdx = Math.floor(Math.random() * library.length);
    } else {
      nextIdx = currentIndex + 1;
      if(nextIdx >= library.length){
        if(repeatMode === 1) nextIdx = 0; else return;
      }
    }
    ensureAudioGraph();
    if(!audioCtx) return;
    isCrossfading = true;
    const nextTrack = library[nextIdx];
    setElementSource(standbyAudio, nextTrack);
    standbyAudio.currentTime = 0;
    const gOut = gainNodeFor(audio), gIn = gainNodeFor(standbyAudio);
    const now = audioCtx.currentTime;
    gIn.gain.cancelScheduledValues(now);
    gIn.gain.setValueAtTime(0, now);
    gOut.gain.cancelScheduledValues(now);
    gOut.gain.setValueAtTime(gOut.gain.value, now);
    standbyAudio.play().catch(()=>{});
    gIn.gain.linearRampToValueAtTime(1, now + crossfadeSeconds);
    gOut.gain.linearRampToValueAtTime(0, now + crossfadeSeconds);

    crossfadeTimeout = setTimeout(() => {
      const finishedEl = audio;
      finishedEl.pause();
      finishedEl.currentTime = 0;
      if(gainNodeFor(finishedEl)) gainNodeFor(finishedEl).gain.value = 1;
      audio = standbyAudio;
      standbyAudio = finishedEl;
      currentIndex = nextIdx;
      const t = library[nextIdx];
      npTitle.textContent = t.title;
      npArtist.textContent = t.artist;
      setDiscVisual(t);
      render();
      isCrossfading = false;
      crossfadeTimeout = null;
    }, crossfadeSeconds * 1000);
  }

  const TONEARM_OUTER = 4, TONEARM_INNER = 20, TONEARM_REST = -30;

  function handleAudioPlay(e){
    if(e.target !== audio) return;
    isPlaying = true;
    document.body.classList.add('is-playing');
    disc.classList.add('spinning');
    tonearm.classList.add('playing');
    tonearm.style.transform = `rotate(${TONEARM_OUTER}deg)`;
    playIcon.innerHTML = PAUSE_SVG;
    playScratchSound();
    if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = 'playing'; }catch(e){} }
  }
  function handleAudioPause(e){
    if(e.target !== audio) return;
    // While a crossfade is in progress, the outgoing track can hit its own
    // natural end (firing a real 'pause') before our swap timeout runs.
    // Ignore that — the incoming track is genuinely still playing, so the
    // UI should stay in the "playing" state without a flicker.
    if(isCrossfading) return;
    isPlaying = false;
    document.body.classList.remove('is-playing');
    disc.classList.remove('spinning');
    tonearm.classList.remove('playing');
    tonearm.style.transform = `rotate(${TONEARM_REST}deg)`;
    playIcon.innerHTML = PLAY_SVG;
    playScratchSound();
    if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = 'paused'; }catch(e){} }
  }
  function updateTonearmProgress(pct){
    if(!isPlaying) return;
    const angle = TONEARM_OUTER + (TONEARM_INNER - TONEARM_OUTER) * (pct / 100);
    tonearm.style.transform = `rotate(${angle}deg)`;
  }
  function playScratchSound(){
    try{
      if(!audioCtx || audioCtx.state === 'suspended') return;
      const duration = 0.16;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i = 0; i < bufferSize; i++){
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = buffer;
      const bandpass = audioCtx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.value = 1800;
      bandpass.Q.value = 0.7;
      const scratchGain = audioCtx.createGain();
      scratchGain.gain.value = 0.22;
      noiseSource.connect(bandpass);
      bandpass.connect(scratchGain);
      scratchGain.connect(audioCtx.destination);
      noiseSource.start();
      noiseSource.stop(audioCtx.currentTime + duration);
    }catch(e){ /* non-critical, skip silently */ }
  }
  function handleAudioTimeUpdate(e){
    const el = e.target;
    if(el !== audio) return;
    if(!el.duration) return;
    const pct = (el.currentTime / el.duration) * 100;
    barFill.style.width = pct + '%';
    currentBarPct = pct;
    barKnob.style.left = pct + '%';
    curTime.textContent = fmtTime(el.currentTime);
    durTime.textContent = fmtTime(el.duration);
    updateTonearmProgress(pct);
    if('mediaSession' in navigator && navigator.mediaSession.setPositionState){
      try{
        navigator.mediaSession.setPositionState({
          duration: el.duration,
          playbackRate: el.playbackRate,
          position: Math.min(el.currentTime, el.duration)
        });
      }catch(e){}
    }

    if(crossfadeSeconds > 0 && !isCrossfading && repeatMode !== 2){
      const remaining = el.duration - el.currentTime;
      if(remaining <= crossfadeSeconds && remaining > 0.05){
        beginCrossfade();
      }
    }
  }
  function handleAudioEnded(e){
    if(e.target !== audio || isCrossfading) return;
    if(repeatMode === 2){
      audio.currentTime = 0;
      audio.play();
    } else {
      playNext(true);
    }
  }

  [audioA, audioB].forEach(el => {
    el.addEventListener('play', handleAudioPlay);
    el.addEventListener('pause', handleAudioPause);
    el.addEventListener('timeupdate', handleAudioTimeUpdate);
    el.addEventListener('ended', handleAudioEnded);
  });

  // ---------- Equalizer ----------
  let audioCtx = null, sourceA = null, sourceB = null, gainA = null, gainB = null, eqFilters = {}, boostNode = null, analyser = null, eqConnected = false;

  function ensureAudioGraph(){
    if(eqConnected) return;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceA = audioCtx.createMediaElementSource(audioA);
      sourceB = audioCtx.createMediaElementSource(audioB);
      gainA = audioCtx.createGain(); gainA.gain.value = 1;
      gainB = audioCtx.createGain(); gainB.gain.value = 1;
      sourceA.connect(gainA);
      sourceB.connect(gainB);

      let prevNode = null;
      EQ_BANDS.forEach((b, i) => {
        const f = audioCtx.createBiquadFilter();
        f.type = b.type;
        f.frequency.value = b.freq;
        if(b.q) f.Q.value = b.q;
        f.gain.value = savedEq[b.key];
        if(i === 0){ gainA.connect(f); gainB.connect(f); } else { prevNode.connect(f); }
        prevNode = f;
        eqFilters[b.key] = f;
      });
      boostNode = audioCtx.createGain();
      boostNode.gain.value = savedEq.boost / 100;
      prevNode.connect(boostNode);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.75;
      boostNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      eqConnected = true;
    }catch(e){
      console.error('Equalizer init failed', e);
    }
  }

  EQ_BANDS.forEach(b => {
    eqSliderEls[b.key].addEventListener('input', () => {
      savedEq[b.key] = parseFloat(eqSliderEls[b.key].value);
      if(eqFilters[b.key]) eqFilters[b.key].gain.value = savedEq[b.key];
      dbSetSetting('eq_' + b.key, savedEq[b.key]);
    });
  });
  eqBoostEl.addEventListener('input', () => {
    savedEq.boost = parseFloat(eqBoostEl.value);
    if(boostNode) boostNode.gain.value = savedEq.boost / 100;
    dbSetSetting('eqBoost', savedEq.boost);
  });
  eqResetBtn.addEventListener('click', () => {
    EQ_BANDS.forEach(b => {
      savedEq[b.key] = 0;
      eqSliderEls[b.key].value = 0;
      if(eqFilters[b.key]) eqFilters[b.key].gain.value = 0;
      dbSetSetting('eq_' + b.key, 0);
    });
    savedEq.boost = 100;
    eqBoostEl.value = 100;
    if(boostNode) boostNode.gain.value = 1;
    dbSetSetting('eqBoost', 100);
  });

  // ---------- Sleep timer ----------
  let sleepTimeout = null, sleepInterval = null, sleepEndAt = null;

  function clearSleepTimer(){
    if(sleepTimeout) clearTimeout(sleepTimeout);
    if(sleepInterval) clearInterval(sleepInterval);
    sleepTimeout = null; sleepInterval = null; sleepEndAt = null;
    sleepStatus.textContent = '';
    sleepBtn.classList.remove('active');
  }
  function updateSleepDisplay(){
    if(!sleepEndAt) return;
    const remain = Math.max(0, sleepEndAt - Date.now());
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    sleepStatus.textContent = `Pausing in ${m}:${s.toString().padStart(2,'0')}`;
  }
  function setSleepTimer(minutes){
    clearSleepTimer();
    if(!minutes) return;
    sleepEndAt = Date.now() + minutes * 60000;
    sleepBtn.classList.add('active');
    updateSleepDisplay();
    sleepInterval = setInterval(updateSleepDisplay, 1000);
    sleepTimeout = setTimeout(() => { pause(); clearSleepTimer(); }, minutes * 60000);
  }

  document.querySelectorAll('.sleep-options button').forEach(btn => {
    btn.addEventListener('click', () => {
      const min = parseInt(btn.dataset.min, 10);
      if(min > 0) setSleepTimer(min); else clearSleepTimer();
      closeAllPopovers();
    });
  });

  // ---------- Themes ----------
  const fxCanvas = document.getElementById('fxCanvas');
  const fxCtx = fxCanvas.getContext('2d');
  let fxRAF = null;

  function resizeCanvas(){
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function stopFx(){
    if(fxRAF) cancelAnimationFrame(fxRAF);
    fxRAF = null;
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }

  // Mouse position tracked globally so interactive themes can react to it
  // without stealing pointer events from the actual UI (canvas stays
  // pointer-events:none; buttons/rows above it work exactly as before).
  let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
  document.addEventListener('click', (e) => {
    if(currentTheme === 'fireworks') spawnFirework(e.clientX, e.clientY);
    if(currentTheme === 'ripple') spawnRipple(e.clientX, e.clientY);
    if(currentTheme === 'bubbles') popBubblesNear(e.clientX, e.clientY);
  });

  function startMatrixRain(){
    stopFx();
    const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const fontSize = 15;
    let columns = Math.floor(fxCanvas.width / fontSize);
    let drops = new Array(columns).fill(0).map(() => Math.random() * -50);
    function draw(){
      fxCtx.fillStyle = 'rgba(2,4,2,0.09)';
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      fxCtx.fillStyle = '#00FF66';
      fxCtx.font = fontSize + 'px monospace';
      for(let i = 0; i < drops.length; i++){
        const ch = chars[Math.floor(Math.random() * chars.length)];
        fxCtx.fillText(ch, i * fontSize, drops[i] * fontSize);
        if(drops[i] * fontSize > fxCanvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  function startGalaxyStars(){
    stopFx();
    const stars = [];
    for(let i = 0; i < 140; i++){
      stars.push({ x: Math.random()*fxCanvas.width, y: Math.random()*fxCanvas.height, r: Math.random()*1.3+0.2, a: Math.random() });
    }
    let shooting = [];
    let frame = 0;
    function spawnShooting(){
      shooting.push({
        x: Math.random() * fxCanvas.width * 0.7,
        y: Math.random() * fxCanvas.height * 0.3,
        len: 80 + Math.random()*100,
        speed: 8 + Math.random()*6,
        angle: Math.PI/4 + (Math.random()*0.2 - 0.1),
        life: 0,
        maxLife: 40 + Math.random()*20
      });
    }
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      stars.forEach(s => {
        s.a += (Math.random()-0.5)*0.05;
        s.a = Math.max(0.2, Math.min(1, s.a));
        fxCtx.beginPath();
        fxCtx.fillStyle = `rgba(255,255,255,${s.a})`;
        fxCtx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        fxCtx.fill();
      });
      frame++;
      if(frame % 90 === 0 && Math.random() > 0.3) spawnShooting();
      shooting.forEach(st => {
        st.life++;
        st.x += Math.cos(st.angle) * st.speed;
        st.y += Math.sin(st.angle) * st.speed;
        const tailX = st.x - Math.cos(st.angle) * st.len;
        const tailY = st.y - Math.sin(st.angle) * st.len;
        const grad = fxCtx.createLinearGradient(st.x, st.y, tailX, tailY);
        grad.addColorStop(0, 'rgba(255,255,255,0.9)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        fxCtx.strokeStyle = grad;
        fxCtx.lineWidth = 2;
        fxCtx.beginPath();
        fxCtx.moveTo(st.x, st.y);
        fxCtx.lineTo(tailX, tailY);
        fxCtx.stroke();
      });
      shooting = shooting.filter(st => st.life < st.maxLife);
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  // ================= ANIMATED THEMES =================

  function startAurora(){
    stopFx();
    let t = 0;
    const bands = [
      { color: 'rgba(80,220,180,0.10)', amp: 60, freq: 0.004, speed: 0.6, yBase: 0.25 },
      { color: 'rgba(120,140,255,0.08)', amp: 80, freq: 0.003, speed: 0.4, yBase: 0.4 },
      { color: 'rgba(200,120,255,0.07)', amp: 70, freq: 0.005, speed: 0.5, yBase: 0.55 }
    ];
    function draw(){
      const w = fxCanvas.width, h = fxCanvas.height;
      fxCtx.clearRect(0, 0, w, h);
      bands.forEach(b => {
        fxCtx.beginPath();
        for(let x = 0; x <= w; x += 12){
          const y = h*b.yBase + Math.sin(x*b.freq + t*b.speed)*b.amp + Math.sin(x*b.freq*0.5 - t*b.speed*0.7)*b.amp*0.5;
          if(x === 0) fxCtx.moveTo(x, y); else fxCtx.lineTo(x, y);
        }
        fxCtx.lineTo(w, 0); fxCtx.lineTo(0, 0); fxCtx.closePath();
        fxCtx.fillStyle = b.color;
        fxCtx.fill();
      });
      t += 1;
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  function startRain(){
    stopFx();
    const drops = [];
    for(let i = 0; i < 150; i++){
      drops.push({ x: Math.random()*fxCanvas.width, y: Math.random()*fxCanvas.height, len: 10+Math.random()*15, speed: 6+Math.random()*8 });
    }
    let flashAlpha = 0, frame = 0;
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      if(flashAlpha > 0){
        fxCtx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
        fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
        flashAlpha -= 0.03;
      }
      fxCtx.strokeStyle = 'rgba(180,200,255,0.35)';
      fxCtx.lineWidth = 1;
      drops.forEach(d => {
        fxCtx.beginPath();
        fxCtx.moveTo(d.x, d.y);
        fxCtx.lineTo(d.x - 2, d.y + d.len);
        fxCtx.stroke();
        d.y += d.speed;
        d.x -= 0.5;
        if(d.y > fxCanvas.height){ d.y = -20; d.x = Math.random()*fxCanvas.width; }
      });
      frame++;
      if(frame % 140 === 0 && Math.random() > 0.5) flashAlpha = 0.5;
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  function startFireflies(){
    stopFx();
    const flies = [];
    for(let i = 0; i < 40; i++){
      flies.push({ x: Math.random()*fxCanvas.width, y: Math.random()*fxCanvas.height, a: Math.random()*Math.PI*2, speed: 0.3+Math.random()*0.5, phase: Math.random()*Math.PI*2 });
    }
    let t = 0;
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      flies.forEach(f => {
        f.a += (Math.random()-0.5)*0.1;
        f.x += Math.cos(f.a)*f.speed;
        f.y += Math.sin(f.a)*f.speed;
        if(f.x < 0) f.x = fxCanvas.width; if(f.x > fxCanvas.width) f.x = 0;
        if(f.y < 0) f.y = fxCanvas.height; if(f.y > fxCanvas.height) f.y = 0;
        const glow = (Math.sin(t*0.05 + f.phase) + 1) / 2;
        fxCtx.beginPath();
        fxCtx.fillStyle = `rgba(200,255,140,${0.15 + glow*0.55})`;
        fxCtx.arc(f.x, f.y, 2 + glow*2, 0, Math.PI*2);
        fxCtx.fill();
      });
      t++;
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  function startSnowfall(){
    stopFx();
    const flakes = [];
    for(let i = 0; i < 120; i++){
      flakes.push({ x: Math.random()*fxCanvas.width, y: Math.random()*fxCanvas.height, r: 1+Math.random()*2.5, speed: 0.5+Math.random()*1.5, drift: Math.random()*2-1 });
    }
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      fxCtx.fillStyle = 'rgba(255,255,255,0.85)';
      flakes.forEach(f => {
        fxCtx.beginPath();
        fxCtx.arc(f.x, f.y, f.r, 0, Math.PI*2);
        fxCtx.fill();
        f.y += f.speed;
        f.x += Math.sin(f.y*0.01)*f.drift*0.5;
        if(f.y > fxCanvas.height){ f.y = -5; f.x = Math.random()*fxCanvas.width; }
      });
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  function startLavaLamp(){
    stopFx();
    const blobs = [];
    for(let i = 0; i < 6; i++){
      blobs.push({ x: Math.random()*fxCanvas.width, y: fxCanvas.height + Math.random()*200, r: 40+Math.random()*50, speed: 0.3+Math.random()*0.4, wob: Math.random()*Math.PI*2 });
    }
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      fxCtx.filter = 'blur(18px)';
      blobs.forEach(b => {
        b.y -= b.speed;
        b.wob += 0.02;
        const x = b.x + Math.sin(b.wob)*30;
        if(b.y < -100){ b.y = fxCanvas.height + 100; b.x = Math.random()*fxCanvas.width; }
        const grad = fxCtx.createRadialGradient(x, b.y, 0, x, b.y, b.r);
        grad.addColorStop(0, 'rgba(255,120,60,0.55)');
        grad.addColorStop(1, 'rgba(255,120,60,0)');
        fxCtx.fillStyle = grad;
        fxCtx.beginPath();
        fxCtx.arc(x, b.y, b.r, 0, Math.PI*2);
        fxCtx.fill();
      });
      fxCtx.filter = 'none';
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  // ================= INTERACTIVE THEMES =================

  let nebulaParticles = [];
  function startNebulaInteractive(){
    stopFx();
    nebulaParticles = [];
    for(let i = 0; i < 90; i++){
      nebulaParticles.push({ x: Math.random()*fxCanvas.width, y: Math.random()*fxCanvas.height, vx: 0, vy: 0, r: 1+Math.random()*2, hue: 260+Math.random()*80 });
    }
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      nebulaParticles.forEach(p => {
        const dx = mouseX - p.x, dy = mouseY - p.y;
        const dist = Math.max(Math.sqrt(dx*dx + dy*dy), 1);
        const force = Math.min(2000 / (dist*dist), 0.6);
        p.vx += (dx/dist) * force * 0.6;
        p.vy += (dy/dist) * force * 0.6;
        p.vx *= 0.96; p.vy *= 0.96;
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0) p.x = fxCanvas.width; if(p.x > fxCanvas.width) p.x = 0;
        if(p.y < 0) p.y = fxCanvas.height; if(p.y > fxCanvas.height) p.y = 0;
        fxCtx.beginPath();
        fxCtx.fillStyle = `hsla(${p.hue},80%,65%,0.7)`;
        fxCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        fxCtx.fill();
      });
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  let fireworkParticles = [];
  function spawnFirework(x, y){
    const hue = Math.random()*360;
    const count = 40;
    for(let i = 0; i < count; i++){
      const angle = (Math.PI*2*i) / count;
      const speed = 2 + Math.random()*3;
      fireworkParticles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 0, maxLife: 50+Math.random()*20, hue });
    }
  }
  function startFireworksInteractive(){
    stopFx();
    fireworkParticles = [];
    let frame = 0;
    function draw(){
      fxCtx.fillStyle = 'rgba(5,5,10,0.18)';
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      frame++;
      if(frame % 110 === 0){
        spawnFirework(Math.random()*fxCanvas.width, fxCanvas.height*0.25 + Math.random()*fxCanvas.height*0.3);
      }
      fireworkParticles.forEach(p => {
        p.life++;
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.03;
        const alpha = Math.max(0, 1 - p.life/p.maxLife);
        fxCtx.beginPath();
        fxCtx.fillStyle = `hsla(${p.hue},90%,65%,${alpha})`;
        fxCtx.arc(p.x, p.y, 2, 0, Math.PI*2);
        fxCtx.fill();
      });
      fireworkParticles = fireworkParticles.filter(p => p.life < p.maxLife);
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  let ripples = [];
  function spawnRipple(x, y){
    ripples.push({ x, y, r: 4, alpha: 0.6 });
  }
  function startRippleInteractive(){
    stopFx();
    ripples = [];
    spawnRipple(fxCanvas.width/2, fxCanvas.height/2);
    let frame = 0;
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      frame++;
      if(frame % 70 === 0) spawnRipple(mouseX, mouseY);
      ripples.forEach(r => {
        r.r += 1.6;
        r.alpha *= 0.975;
        fxCtx.beginPath();
        fxCtx.strokeStyle = `rgba(120,220,220,${r.alpha})`;
        fxCtx.lineWidth = 2;
        fxCtx.arc(r.x, r.y, r.r, 0, Math.PI*2);
        fxCtx.stroke();
      });
      ripples = ripples.filter(r => r.alpha > 0.02);
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  let constellationStars = [];
  function startConstellationInteractive(){
    stopFx();
    constellationStars = [];
    for(let i = 0; i < 70; i++){
      constellationStars.push({ x: Math.random()*fxCanvas.width, y: Math.random()*fxCanvas.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3 });
    }
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      constellationStars.forEach(s => {
        s.x += s.vx; s.y += s.vy;
        if(s.x < 0 || s.x > fxCanvas.width) s.vx *= -1;
        if(s.y < 0 || s.y > fxCanvas.height) s.vy *= -1;
        fxCtx.beginPath();
        fxCtx.fillStyle = 'rgba(200,210,255,0.8)';
        fxCtx.arc(s.x, s.y, 1.6, 0, Math.PI*2);
        fxCtx.fill();
      });
      // connect stars near the mouse to the cursor, and to each other
      for(let i = 0; i < constellationStars.length; i++){
        const s = constellationStars[i];
        const dxm = mouseX - s.x, dym = mouseY - s.y;
        const dm = Math.sqrt(dxm*dxm + dym*dym);
        if(dm < 160){
          fxCtx.beginPath();
          fxCtx.strokeStyle = `rgba(140,166,255,${(1 - dm/160)*0.5})`;
          fxCtx.lineWidth = 1;
          fxCtx.moveTo(s.x, s.y);
          fxCtx.lineTo(mouseX, mouseY);
          fxCtx.stroke();
        }
        for(let j = i+1; j < constellationStars.length; j++){
          const o = constellationStars[j];
          const dx = o.x - s.x, dy = o.y - s.y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if(d < 90){
            fxCtx.beginPath();
            fxCtx.strokeStyle = `rgba(140,166,255,${(1 - d/90)*0.25})`;
            fxCtx.lineWidth = 1;
            fxCtx.moveTo(s.x, s.y);
            fxCtx.lineTo(o.x, o.y);
            fxCtx.stroke();
          }
        }
      }
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  let bubbleList = [];
  function popBubblesNear(x, y){
    bubbleList.forEach(b => {
      const dx = b.x - x, dy = b.y - y;
      if(Math.sqrt(dx*dx + dy*dy) < b.r + 20 && !b.popped){
        b.popped = true;
        b.popFrame = 0;
      }
    });
  }
  function startBubblesInteractive(){
    stopFx();
    bubbleList = [];
    for(let i = 0; i < 26; i++){
      bubbleList.push({ x: Math.random()*fxCanvas.width, y: fxCanvas.height + Math.random()*300, r: 8+Math.random()*22, speed: 0.5+Math.random()*1.2, drift: Math.random()*2-1, popped: false, popFrame: 0 });
    }
    function draw(){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      bubbleList.forEach(b => {
        if(b.popped){
          b.popFrame++;
          const pr = b.r + b.popFrame*3;
          fxCtx.beginPath();
          fxCtx.strokeStyle = `rgba(80,190,195,${Math.max(0, 0.6 - b.popFrame*0.06)})`;
          fxCtx.lineWidth = 2;
          fxCtx.arc(b.x, b.y, pr, 0, Math.PI*2);
          fxCtx.stroke();
          if(b.popFrame > 10){
            b.popped = false; b.popFrame = 0;
            b.x = Math.random()*fxCanvas.width; b.y = fxCanvas.height + Math.random()*100; b.r = 8+Math.random()*22;
          }
          return;
        }
        b.y -= b.speed;
        b.x += Math.sin(b.y*0.01)*b.drift*0.4;
        if(b.y < -b.r){ b.y = fxCanvas.height + Math.random()*100; b.x = Math.random()*fxCanvas.width; }
        fxCtx.beginPath();
        fxCtx.strokeStyle = 'rgba(80,190,195,0.55)';
        fxCtx.lineWidth = 1.5;
        fxCtx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        fxCtx.stroke();
        fxCtx.beginPath();
        fxCtx.fillStyle = 'rgba(255,255,255,0.35)';
        fxCtx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.18, 0, Math.PI*2);
        fxCtx.fill();
      });
      fxRAF = requestAnimationFrame(draw);
    }
    draw();
  }

  let currentTheme = 'vinyl';

  function applyTheme(theme){
    currentTheme = theme;
    document.body.setAttribute('data-theme', theme);
    if(theme === 'matrix') startMatrixRain();
    else if(theme === 'galaxy') startGalaxyStars();
    else if(theme === 'aurora') startAurora();
    else if(theme === 'rain') startRain();
    else if(theme === 'fireflies') startFireflies();
    else if(theme === 'snowfall') startSnowfall();
    else if(theme === 'lavalamp') startLavaLamp();
    else if(theme === 'nebula') startNebulaInteractive();
    else if(theme === 'fireworks') startFireworksInteractive();
    else if(theme === 'ripple') startRippleInteractive();
    else if(theme === 'constellation') startConstellationInteractive();
    else if(theme === 'bubbles') startBubblesInteractive();
    else stopFx();
    dbSetSetting('theme', theme);
    document.querySelectorAll('.theme-swatch').forEach(el => {
      el.classList.toggle('active', el.dataset.theme === theme);
    });
  }

  document.querySelectorAll('.theme-swatch').forEach(btn => {
    btn.addEventListener('click', () => { applyTheme(btn.dataset.theme); closeAllPopovers(); });
  });

  // ---------- Toolbar popovers ----------
  function closeAllPopovers(){
    document.querySelectorAll('.popover').forEach(p => p.classList.remove('open'));
  }
  function togglePopover(el){
    const isOpen = el.classList.contains('open');
    closeAllPopovers();
    if(!isOpen) el.classList.add('open');
  }
  themeBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePopover(themePanel); });
  eqBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePopover(eqPanel); });
  sleepBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePopover(sleepPanel); });
  progressStyleBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePopover(progressStylePanel); });
  lyricsBtn.addEventListener('click', (e) => { e.stopPropagation(); refreshLyricsPanel(); togglePopover(lyricsPanel); });
  document.addEventListener('click', () => closeAllPopovers());
  document.querySelectorAll('.popover').forEach(p => p.addEventListener('click', e => e.stopPropagation()));

  // ---------- Crossfade ----------
  crossfadeSlider.addEventListener('input', () => {
    crossfadeSeconds = parseInt(crossfadeSlider.value, 10);
    crossfadeStatus.textContent = crossfadeSeconds === 0 ? 'Off' : crossfadeSeconds + 's crossfade';
    dbSetSetting('crossfadeSeconds', crossfadeSeconds);
  });

  // ---------- Progress bar style ----------
  const barCanvas = document.getElementById('barCanvas');
  const barCtx = barCanvas.getContext('2d');
  let currentBarPct = 0;
  let progressStyle = 'classic';
  let progressAnimT = 0;
  let progressBarRAF = null;

  function roundRectPath(ctx, x, y, w, h, r){
    r = Math.min(r, h/2, w/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function getAccentColor(){
    return getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#C98A4B';
  }

  function drawLightspeed(ctx, w, h, pct, t, accent){
    const fillW = w * (pct/100);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRectPath(ctx, 0, h/2-1.5, w, 3, 1.5); ctx.fill();
    const grad = ctx.createLinearGradient(0, 0, fillW, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, accent);
    ctx.fillStyle = grad;
    ctx.shadowColor = accent; ctx.shadowBlur = 8;
    roundRectPath(ctx, 0, h/2-2, fillW, 4, 2); ctx.fill();
    if(fillW > 1){
      ctx.beginPath();
      ctx.fillStyle = '#fff';
      ctx.shadowColor = accent; ctx.shadowBlur = 14;
      ctx.arc(fillW, h/2, 3.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawWaterFill(ctx, w, h, pct, t, accent){
    roundRectPath(ctx, 0, 0, w, h, h/2);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();
    const fillW = w * (pct/100);
    if(fillW < 1) return;
    ctx.save();
    roundRectPath(ctx, 0, 0, w, h, h/2);
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(0, h);
    for(let x = 0; x <= fillW; x += 4){
      const y = h*0.42 + Math.sin(x*0.18 + t*3) * h*0.18;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(fillW, h);
    ctx.closePath();
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.75;
    ctx.fill();
    ctx.globalAlpha = 1;
    // a couple rising bubbles
    for(let i = 0; i < 2; i++){
      const bx = (fillW * 0.3) + i * (fillW * 0.4);
      const by = h - ((t*20 + i*17) % h);
      if(bx < fillW - 4){
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.arc(bx, by, 1.3, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawWave(ctx, w, h, pct, t, accent){
    const fillX = w * (pct/100);
    function pathAt(step){
      ctx.beginPath();
      for(let x = 0; x <= w; x += step){
        const y = h/2 + Math.sin(x*0.22 + t*4) * (h/2-2) * (0.5 + 0.5*Math.sin(x*0.015 + t*0.7));
        if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    }
    pathAt(3);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, fillX, h);
    ctx.clip();
    pathAt(3);
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = accent; ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawNeonPulse(ctx, w, h, pct, t, accent){
    const fillW = w * (pct/100);
    let energy = 0.35 + Math.sin(t*2) * 0.1;
    if(analyser && isPlaying){
      try{
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for(let i = 0; i < 20; i++) sum += data[i];
        energy = Math.min(1, sum / (20*170));
      }catch(e){}
    }
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRectPath(ctx, 0, h/2-2, w, 4, 2); ctx.fill();
    ctx.shadowColor = accent;
    ctx.shadowBlur = 6 + energy*18;
    ctx.fillStyle = accent;
    roundRectPath(ctx, 0, h/2-3, fillW, 6, 3); ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawGroove(ctx, w, h, pct, t, accent){
    const fillW = w * (pct/100);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    for(let x = 0; x < w; x += 3){
      ctx.beginPath(); ctx.moveTo(x, 1); ctx.lineTo(x, h-1); ctx.stroke();
    }
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, fillW, h); ctx.clip();
    ctx.strokeStyle = accent;
    for(let x = 0; x < w; x += 3){
      ctx.beginPath(); ctx.moveTo(x, 1); ctx.lineTo(x, h-1); ctx.stroke();
    }
    ctx.restore();
  }

  function drawProgressBarFrame(){
    if(progressStyle === 'classic'){ progressBarRAF = null; return; }
    const w = bar.clientWidth, h = bar.clientHeight;
    if(w === 0 || h === 0){ progressBarRAF = requestAnimationFrame(drawProgressBarFrame); return; }
    if(barCanvas.width !== w) barCanvas.width = w;
    if(barCanvas.height !== h) barCanvas.height = h;
    barCtx.clearRect(0, 0, w, h);
    progressAnimT += 0.02;
    const accent = getAccentColor();
    if(progressStyle === 'lightspeed') drawLightspeed(barCtx, w, h, currentBarPct, progressAnimT, accent);
    else if(progressStyle === 'water') drawWaterFill(barCtx, w, h, currentBarPct, progressAnimT, accent);
    else if(progressStyle === 'wave') drawWave(barCtx, w, h, currentBarPct, progressAnimT, accent);
    else if(progressStyle === 'neonpulse') drawNeonPulse(barCtx, w, h, currentBarPct, progressAnimT, accent);
    else if(progressStyle === 'groove') drawGroove(barCtx, w, h, currentBarPct, progressAnimT, accent);
    progressBarRAF = requestAnimationFrame(drawProgressBarFrame);
  }

  function drawVisualizer(){
    if(!document.body.classList.contains('viz-on')){ vizRAF = null; return; }
    resizeVizCanvas();
    const w = vizCanvas.width, h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);
    if(analyser && isPlaying){
      const bufferLength = analyser.frequencyBinCount;
      const data = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(data);
      const barCount = 48;
      const step = Math.floor(bufferLength / barCount);
      const barWidth = w / barCount;
      const accentColor = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#C98A4B';
      for(let i = 0; i < barCount; i++){
        const v = data[i * step] / 255;
        const barHeight = v * h * 0.85;
        vizCtx.fillStyle = accentColor;
        vizCtx.globalAlpha = 0.55 + v * 0.45;
        vizCtx.fillRect(i * barWidth + 2, h - barHeight, barWidth - 4, barHeight);
      }
      vizCtx.globalAlpha = 1;
    } else {
      vizCtx.fillStyle = 'rgba(255,255,255,0.15)';
      for(let i = 0; i < 48; i++){
        vizCtx.fillRect(i * (w/48) + 2, h - 4, (w/48) - 4, 4);
      }
    }
    vizRAF = requestAnimationFrame(drawVisualizer);
