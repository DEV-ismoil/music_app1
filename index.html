<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groove — PC Edition</title>
<style>
  :root{
    --bg: #14120F;
    --bg-panel: #1C1915;
    --bg-raised: #262119;
    --line: #33291E;
    --text: #ECE3D3;
    --text-dim: #9C8F7A;
    --accent: #C98A4B;
    --accent-dim: #7A5A34;
    --brass: #A9895A;
    --bg-glow: #201B14;
    --serif: Georgia, 'Iowan Old Style', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(1200px 800px at 20% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    overflow:hidden;
    height:100vh;
  }
  #fxCanvas{ position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; }
  .app{ position:relative; z-index:1; display:grid; grid-template-columns: 380px 1fr; height:100vh; }
  
  /* Left Panel: Library */
  .library{ background: var(--bg-panel); border-right: 1px solid var(--line); display:flex; flex-direction:column; }
  .library-head{ padding: 22px 20px 14px; border-bottom: 1px solid var(--line); }
  .brand{ font-family: var(--serif); font-size: 24px; color: var(--text); }
  .brand span{ color: var(--accent); }
  .sub{ font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }
  .search-row{ padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .search-row input{
    width:100%; background: var(--bg-raised); border: 1px solid var(--line); color: var(--text);
    padding: 9px 12px; border-radius: 6px; font-size: 13px; outline:none;
  }
  .search-row input:focus{ border-color: var(--accent-dim); }
  .add-row{ padding: 12px 20px; border-bottom: 1px solid var(--line); display:flex; gap:8px; }
  .btn{
    font-size: 12.5px; font-weight: 600; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg-raised); color: var(--text); padding: 9px 14px; cursor:pointer;
  }
  .btn:hover{ border-color: var(--accent-dim); }
  .btn.primary{ background: var(--accent); border-color: var(--accent); color: #1A1109; }
  .add-row .btn{ flex:1; }
  
  .track-list{ flex:1; overflow-y:auto; padding: 6px 0; }
  .track-row{
    display:grid; grid-template-columns: 26px 1fr 30px; align-items:center; gap: 10px;
    padding: 10px 20px; cursor:pointer; border-left: 2px solid transparent;
  }
  .track-row:hover{ background: rgba(127,127,127,0.08); }
  .track-row.active{ background: rgba(201,138,75,0.12); border-left-color: var(--accent); }
  .track-num{ font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-align:right; }
  .track-title{ font-size: 13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-artist{ font-size: 11px; color: var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-del{ background:none; border:none; color: var(--text-dim); cursor:pointer; opacity:0; }
  .track-row:hover .track-del{ opacity:1; }
  
  /* Right Panel: Stage */
  .stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 40px; position:relative; }
  .turntable{ position:relative; width: 380px; height: 330px; display:flex; align-items:center; justify-content:center; }
  .plinth{ position:absolute; width: 360px; height: 310px; border-radius: 14px; background: linear-gradient(160deg, #3A2E20, #150E06); box-shadow: 0 35px 70px -25px rgba(0,0,0,0.75); }
  .disc{
    width: 260px; height: 260px; border-radius: 50%;
    background: repeating-radial-gradient(circle at center, #0E0C0A 0px, #0E0C0A 2px, #17140F 3px, #17140F 5px);
    display:flex; align-items:center; justify-content:center; animation: spin 9s linear infinite paused;
  }
  .disc.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .label{ width: 140px; height: 140px; border-radius: 50%; background: var(--accent); color:#1A1109; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; text-align:center; }
  .label-text{ font-weight:bold; font-size:12px; }
  .label-artist{ font-size:9px; margin-top:4px; font-family:var(--mono); }
  
  .now-playing{ margin-top: 24px; text-align:center; }
  .np-title{ font-family: var(--serif); font-size: 22px; }
  .np-artist{ font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  
  .progress-wrap{ width: 440px; margin-top: 20px; display:flex; align-items:center; gap: 10px; }
  .time{ font-family: var(--mono); font-size: 11px; color: var(--text-dim); width: 38px; }
  .bar{ flex:1; height: 4px; background: var(--line); border-radius: 2px; position:relative; cursor:pointer; }
  .bar-fill{ position:absolute; left:0; top:0; bottom:0; background: var(--accent); border-radius: 2px; width:0%; }
  
  .controls{ margin-top: 20px; display:flex; align-items:center; gap: 20px; }
  .ctl-btn{ background:none; border:none; color: var(--text-dim); cursor:pointer; display:flex; align-items:center; }
  .ctl-btn:hover{ color: var(--text); }
  .play-btn{ width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #1A1109; justify-content:center; }
  .volume-row{ margin-top: 18px; display:flex; align-items:center; gap: 10px; color: var(--text-dim); }
  .vol-bar{ width: 100px; height: 4px; background: var(--line); border-radius: 2px; position:relative; cursor:pointer; }
  .vol-fill{ position:absolute; left:0; top:0; bottom:0; background: var(--brass); border-radius: 2px; width:70%; }
  .shortcuts-hint{ position:absolute; bottom:16px; font-family:var(--mono); font-size:10px; color:var(--text-dim); }
</style>
</head>
<body>
<canvas id="fxCanvas"></canvas>
<div class="app">
  <div class="library">
    <div class="library-head">
      <div class="brand">Groove<span>.</span></div>
      <div class="sub">Desktop Edition</div>
    </div>
    <div class="search-row"><input id="search" type="text" placeholder="Search tracks… (Ctrl+F)"></div>
    <div class="add-row">
      <button class="btn primary" id="addBtn">+ Add Files</button>
      <button class="btn" id="clearBtn">Clear</button>
    </div>
    <input type="file" id="fileInput" multiple style="display:none">
    <div class="track-list" id="trackList"></div>
  </div>

  <div class="stage">
    <div class="turntable">
      <div class="plinth"></div>
      <div class="disc" id="disc">
        <div class="label">
          <div class="label-text" id="discTitle">Groove</div>
          <div class="label-artist" id="discArtist">Ready</div>
        </div>
      </div>
    </div>
    <div class="now-playing">
      <div class="np-title" id="npTitle">No track playing</div>
      <div class="np-artist" id="npArtist">Select a song or press Space</div>
    </div>
    <div class="progress-wrap">
      <div class="time" id="curTime">0:00</div>
      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="time" id="durTime">0:00</div>
    </div>
    <div class="controls">
      <button class="ctl-btn" id="prevBtn">⏮</button>
      <button class="ctl-btn play-btn" id="playBtn">▶</button>
      <button class="ctl-btn" id="nextBtn">⏭</button>
    </div>
    <div class="volume-row">
      <span>🔊</span>
      <div class="vol-bar" id="volBar"><div class="vol-fill" id="volFill"></div></div>
    </div>
    <div class="shortcuts-hint">SHORTCUTS: SPACE (PLAY/PAUSE) · LEFT/RIGHT (SEEK) · UP/DOWN (VOLUME)</div>
  </div>
</div>

<script>
  let db, library = [], currentIndex = -1;
  const audio = new Audio();
  const req = indexedDB.open('groove-pc', 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore('tracks', {keyPath:'id'});
  req.onsuccess = e => { db = e.target.result; loadLibrary(); };

  function loadLibrary() {
    const tx = db.transaction('tracks', 'readonly');
    tx.objectStore('tracks').getAll().onsuccess = e => {
      library = e.target.result || [];
      render();
    };
  }

  function render() {
    const list = document.getElementById('trackList');
    list.innerHTML = '';
    library.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'track-row' + (i === currentIndex ? ' active' : '');
      el.innerHTML = `
        <div class="track-num">${i+1}</div>
        <div><div class="track-title">${item.title}</div><div class="track-artist">${item.artist}</div></div>
        <button class="track-del">✕</button>
      `;
      el.onclick = () => playTrack(i);
      el.querySelector('.track-del').onclick = (e) => { e.stopPropagation(); deleteTrack(item.id); };
      list.appendChild(el);
    });
  }

  function playTrack(idx) {
    if (idx < 0 || idx >= library.length) return;
    currentIndex = idx;
    const item = library[idx];
    audio.src = URL.createObjectURL(item.blob);
    audio.play();
    document.getElementById('npTitle').textContent = item.title;
    document.getElementById('npArtist').textContent = item.artist;
    document.getElementById('discTitle').textContent = item.title;
    document.getElementById('discArtist').textContent = item.artist;
    document.getElementById('disc').classList.add('spinning');
    document.getElementById('playBtn').textContent = '⏸';
    render();
  }

  function deleteTrack(id) {
    const tx = db.transaction('tracks', 'readwrite');
    tx.objectStore('tracks').delete(id).onsuccess = () => loadLibrary();
  }

  document.getElementById('addBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = e => {
    const files = e.target.files;
    for (let file of files) {
      const parts = file.name.replace(/\.[^/.]+$/, "").split(" - ");
      const item = {
        id: Date.now() + Math.random(),
        title: parts[1] || parts[0],
        artist: parts[1] ? parts[0] : "Unknown",
        blob: file
      };
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put(item);
    }
    setTimeout(loadLibrary, 200);
  };

  document.getElementById('playBtn').onclick = () => {
    if (currentIndex === -1 && library.length > 0) return playTrack(0);
    if (audio.paused) {
      audio.play();
      document.getElementById('disc').classList.add('spinning');
      document.getElementById('playBtn').textContent = '⏸';
    } else {
      audio.pause();
      document.getElementById('disc').classList.remove('spinning');
      document.getElementById('playBtn').textContent = '▶';
    }
  };

  document.getElementById('nextBtn').onclick = () => playTrack((currentIndex + 1) % library.length);
  document.getElementById('prevBtn').onclick = () => playTrack((currentIndex - 1 + library.length) % library.length);

  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('barFill').style.width = pct + '%';
    document.getElementById('curTime').textContent = formatTime(audio.currentTime);
    document.getElementById('durTime').textContent = formatTime(audio.duration);
  };

  function formatTime(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
  }

  // Keyboard Shortcuts
  window.onkeydown = e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); document.getElementById('playBtn').click(); }
    if (e.code === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    if (e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
    if (e.code === 'ArrowUp') audio.volume = Math.min(1, audio.volume + 0.1);
    if (e.code === 'ArrowDown') audio.volume = Math.max(0, audio.volume - 0.1);
  };
</script>
</body>
</html>
