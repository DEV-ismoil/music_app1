<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<style>
  :root{
    --bg: #14120F;
    --bg-panel: #1C1915;
    --bg-raised: #262119;
    --line: #33291E;
    --text: #ECE3D3;
    --text-dim: #9C8F7A;
    --accent: #C98A4B;
    --accent-dim: #7A5A34;
    --brass: #A9895A;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(1200px 800px at 20% -10%, #201B14 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    overflow:hidden;
  }
  ::selection{ background: var(--accent-dim); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .app{
    display:grid;
    grid-template-columns: 340px 1fr;
    height:100vh;
  }

  /* ---------- LIBRARY (left) ---------- */
  .library{
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .library-head{
    padding: 22px 20px 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .brand .accent-dot{ color: var(--accent); }
  .sub{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .search-row{
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .search-row input{
    width:100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--sans);
    outline:none;
  }
  .search-row input:focus{ border-color: var(--accent-dim); }
  .search-row input::placeholder{ color: var(--text-dim); }

  .add-row{
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    display:flex;
    gap:8px;
  }
  .btn{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text);
    padding: 9px 14px;
    cursor:pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover{ border-color: var(--accent-dim); color:#fff; }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #1A1109;
  }
  .btn.primary:hover{ background:#D69759; }
  .add-row .btn{ flex:1; }

  .track-list{
    flex:1;
    overflow-y:auto;
    padding: 6px 0 20px 0;
  }
  .track-row{
    display:grid;
    grid-template-columns: 26px 1fr auto 26px;
    align-items:center;
    gap: 10px;
    padding: 10px 20px;
    cursor:pointer;
    border-left: 2px solid transparent;
  }
  .track-row:hover{ background: rgba(255,255,255,0.03); }
  .track-row.active{
    background: rgba(201,138,75,0.10);
    border-left-color: var(--accent);
  }
  .track-num{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align:right;
  }
  .track-row.active .track-num{ color: var(--accent); }
  .track-meta{ min-width:0; }
  .track-title{
    font-size: 13.5px;
    color: var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-artist{
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-dur{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .track-del{
    opacity:0;
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    font-size: 15px;
    line-height:1;
  }
  .track-row:hover .track-del{ opacity:1; }
  .track-del:hover{ color: #D9694C; }

  .empty-lib{
    padding: 40px 24px;
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    line-height:1.6;
  }
  .empty-lib b{ color: var(--text); }

  /* ---------- STAGE (right) ---------- */
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px;
    min-width:0;
    background:
      radial-gradient(600px 400px at 50% 30%, rgba(201,138,75,0.06), transparent 70%);
  }

  .disc-wrap{
    position:relative;
    width: 300px;
    height: 300px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .disc{
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #0E0C0A 0px, #0E0C0A 2px,
        #17140F 3px, #17140F 5px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin 9s linear infinite paused;
  }
  .disc.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .label{
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), #8A5B2E);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    box-shadow: 0 0 0 2px #0E0C0A, inset 0 2px 6px rgba(255,255,255,0.15);
    padding: 14px;
    overflow:hidden;
  }
  .label-text{
    font-family: var(--serif);
    font-weight: bold;
    color: #1A1109;
    line-height: 1.15;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .label-artist{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(26,17,9,0.75);
    margin-top: 5px;
  }
  .spindle{
    position:absolute;
    width: 10px; height:10px;
    border-radius:50%;
    background:#0A0908;
    box-shadow: 0 0 0 2px #2A2419;
  }

  .now-playing{
    margin-top: 30px;
    text-align:center;
    max-width: 480px;
  }
  .np-title{
    font-family: var(--serif);
    font-size: 24px;
    color: var(--text);
  }
  .np-artist{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform:uppercase;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .progress-wrap{
    width: 460px;
    max-width: 80vw;
    margin-top: 26px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .time{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 38px;
  }
  .time.right{ text-align:right; }
  .bar{
    flex:1;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    position:relative;
    cursor:pointer;
  }
  .bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    background: var(--accent);
    border-radius: 2px;
    width:0%;
  }
  .bar-knob{
    position:absolute;
    top:50%;
    width:11px; height:11px;
    background: var(--text);
    border-radius:50%;
    transform: translate(-50%,-50%);
    left:0%;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.3);
  }

  .controls{
    margin-top: 26px;
    display:flex;
    align-items:center;
    gap: 22px;
  }
  .ctl-btn{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: color .15s, transform .1s;
  }
  .ctl-btn:hover{ color: var(--text); }
  .ctl-btn:active{ transform: scale(0.92); }
  .ctl-btn.toggled{ color: var(--accent); }
  .ctl-btn svg{ width:18px; height:18px; }
  .play-btn{
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #1A1109;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px -6px rgba(201,138,75,0.6);
  }
  .play-btn:hover{ background:#D69759; color:#1A1109; }
  .play-btn svg{ width:20px; height:20px; }

  .volume-row{
    margin-top: 22px;
    display:flex;
    align-items:center;
    gap: 10px;
    color: var(--text-dim);
  }
  .volume-row svg{ width:15px; height:15px; }
  .vol-bar{
    width: 100px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    position:relative;
    cursor:pointer;
  }
  .vol-fill{
    position:absolute; left:0; top:0; bottom:0;
    background: var(--brass);
    border-radius: 2px;
    width: 70%;
  }

  .hint{
    position:absolute;
    bottom: 22px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    opacity: 0.6;
  }

  input[type=file]{ display:none; }

  @media (max-width: 720px){
    .app{ grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    .library{ border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="app">

  <!-- LIBRARY -->
  <div class="library">
    <div class="library-head">
      <div class="brand">Groove<span class="accent-dot">.</span></div>
      <div class="sub">your music, offline, no ads</div>
    </div>
    <div class="search-row">
      <input id="search" type="text" placeholder="Search your library…">
    </div>
    <div class="add-row">
      <button class="btn primary" id="addBtn">+ Add music files</button>
      <button class="btn" id="clearBtn" title="Remove everything">Clear</button>
    </div>
    <input type="file" id="fileInput" accept="audio/*" multiple>
    <div class="track-list" id="trackList"></div>
  </div>

  <!-- STAGE -->
  <div class="stage">
    <div class="disc-wrap">
      <div class="disc" id="disc">
        <div class="label" id="discLabel">
          <div class="label-text" id="discText">Groove</div>
          <div class="label-artist" id="discArtist"></div>
        </div>
      </div>
      <div class="spindle"></div>
    </div>

    <div class="now-playing">
      <div class="np-title" id="npTitle">Nothing loaded yet</div>
      <div class="np-artist" id="npArtist">ADD SOME MUSIC TO BEGIN</div>
    </div>

    <div class="progress-wrap">
      <div class="time" id="curTime">0:00</div>
      <div class="bar" id="bar">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-knob" id="barKnob"></div>
      </div>
      <div class="time right" id="durTime">0:00</div>
    </div>

    <div class="controls">
      <button class="ctl-btn" id="shuffleBtn" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      </button>
      <button class="ctl-btn" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><rect x="5" y="4" width="2" height="16"></rect></svg>
      </button>
      <button class="ctl-btn play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
      </button>
      <button class="ctl-btn" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><rect x="17" y="4" width="2" height="16"></rect></svg>
      </button>
      <button class="ctl-btn" id="repeatBtn" title="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5L6 9H2v6h4l5 4V5z"></path></svg>
      <div class="vol-bar" id="volBar"><div class="vol-fill" id="volFill"></div></div>
    </div>

    <div class="hint">DOUBLE-CLICK A TRACK TO PLAY · DRAG FILES ANYWHERE TO ADD</div>
  </div>

</div>

<script>
(function(){
  // ---------- IndexedDB storage ----------
  const DB_NAME = 'groove-player';
  const STORE = 'tracks';
  let db;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)){
          d.createObjectStore(STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e);
    });
  }

  function dbAll(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const store = tx.objectStore(STORE);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e);
    });
  }
  function dbPut(track){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(track);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }
  function dbDelete(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }
  function dbClear(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }

  // ---------- App state ----------
  let library = [];       // {id, name, artist, blob, duration}
  let filtered = [];
  let currentIndex = -1;
  let isPlaying = false;
  let isShuffle = false;
  let repeatMode = 0; // 0 off, 1 all, 2 one
  let objectUrl = null;

  const audio = new Audio();
  audio.volume = 0.7;

  const trackListEl = document.getElementById('trackList');
  const searchEl = document.getElementById('search');
  const fileInput = document.getElementById('fileInput');
  const addBtn = document.getElementById('addBtn');
  const clearBtn = document.getElementById('clearBtn');
  const npTitle = document.getElementById('npTitle');
  const npArtist = document.getElementById('npArtist');
  const disc = document.getElementById('disc');
  const discText = document.getElementById('discText');
  const discArtist = document.getElementById('discArtist');

  function setDiscLabel(title, artist){
    discText.textContent = title || 'Groove';
    discArtist.textContent = artist || '';
    const len = (title || '').length;
    let size = 20;
    if(len > 10) size = 17;
    if(len > 18) size = 14;
    if(len > 28) size = 12;
    if(len > 40) size = 10.5;
    discText.style.fontSize = size + 'px';
  }
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const bar = document.getElementById('bar');
  const barFill = document.getElementById('barFill');
  const barKnob = document.getElementById('barKnob');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const volBar = document.getElementById('volBar');
  const volFill = document.getElementById('volFill');

  const PLAY_SVG = '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
  const PAUSE_SVG = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function guessArtistTitle(filename){
    let name = filename.replace(/\.[^/.]+$/, '');
    let parts = name.split(' - ');
    if(parts.length >= 2){
      return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
    }
    return { artist: 'Unknown artist', title: name.trim() };
  }

  // ---------- Rendering ----------
  function render(){
    const q = searchEl.value.trim().toLowerCase();
    filtered = library.filter(t =>
      !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
    );

    if(library.length === 0){
      trackListEl.innerHTML = `<div class="empty-lib">
        <b>Your library is empty.</b><br><br>
        Click <b>+ Add music files</b> and pick songs you own from your computer.
        They'll be saved here permanently — no need to re-add them next time.
      </div>`;
      return;
    }

    trackListEl.innerHTML = filtered.map((t, i) => {
      const activeClass = (t.id === (library[currentIndex] && library[currentIndex].id)) ? 'active' : '';
      return `<div class="track-row ${activeClass}" data-id="${t.id}">
        <div class="track-num">${i+1}</div>
        <div class="track-meta">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-artist">${escapeHtml(t.artist)}</div>
        </div>
        <div class="track-dur">${t.duration ? fmtTime(t.duration) : ''}</div>
        <button class="track-del" data-del="${t.id}" title="Remove">✕</button>
      </div>`;
    }).join('');
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Playback ----------
  function libIndexOf(id){ return library.findIndex(t => t.id === id); }

  function loadTrack(idx, autoplay){
    if(idx < 0 || idx >= library.length) return;
    currentIndex = idx;
    const t = library[idx];
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(t.blob);
    audio.src = objectUrl;
    npTitle.textContent = t.title;
    npArtist.textContent = t.artist;
    setDiscLabel(t.title, t.artist);
    render();
    if(autoplay){
      audio.play().catch(()=>{});
    }
  }

  function play(){
    if(currentIndex === -1 && library.length > 0){
      loadTrack(0, true);
      return;
    }
    audio.play().catch(()=>{});
  }
  function pause(){ audio.pause(); }

  function playNext(auto){
    if(library.length === 0) return;
    let idx;
    if(isShuffle){
      idx = Math.floor(Math.random() * library.length);
    } else {
      idx = currentIndex + 1;
      if(idx >= library.length){
        if(repeatMode === 1) idx = 0;
        else { if(auto){ pause(); } return; }
      }
    }
    loadTrack(idx, true);
  }
  function playPrev(){
    if(library.length === 0) return;
    let idx = currentIndex - 1;
    if(idx < 0) idx = library.length - 1;
    loadTrack(idx, true);
  }

  audio.addEventListener('play', () => {
    isPlaying = true;
    disc.classList.add('spinning');
    playIcon.innerHTML = PAUSE_SVG;
  });
  audio.addEventListener('pause', () => {
    isPlaying = false;
    disc.classList.remove('spinning');
    playIcon.innerHTML = PLAY_SVG;
  });
  audio.addEventListener('timeupdate', () => {
    if(!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    barFill.style.width = pct + '%';
    barKnob.style.left = pct + '%';
    curTime.textContent = fmtTime(audio.currentTime);
    durTime.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', () => {
    if(repeatMode === 2){
      audio.currentTime = 0;
      audio.play();
    } else {
      playNext(true);
    }
  });

  // ---------- Controls ----------
  playBtn.addEventListener('click', () => isPlaying ? pause() : play());
  nextBtn.addEventListener('click', () => playNext(false));
  prevBtn.addEventListener('click', playPrev);
  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('toggled', isShuffle);
  });
  repeatBtn.addEventListener('click', () => {
    repeatMode = (repeatMode + 1) % 3;
    repeatBtn.classList.toggle('toggled', repeatMode !== 0);
    repeatBtn.style.opacity = repeatMode === 2 ? '0.7' : '1';
    repeatBtn.title = repeatMode === 0 ? 'Repeat off' : repeatMode === 1 ? 'Repeat all' : 'Repeat one';
  });

  bar.addEventListener('click', (e) => {
    if(!audio.duration) return;
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  volBar.addEventListener('click', (e) => {
    const rect = volBar.getBoundingClientRect();
    let pct = (e.clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    audio.volume = pct;
    volFill.style.width = (pct*100) + '%';
  });
  volFill.style.width = (audio.volume*100) + '%';

  trackListEl.addEventListener('dblclick', (e) => {
    const row = e.target.closest('.track-row');
    if(!row) return;
    const id = row.dataset.id;
    const idx = libIndexOf(id);
    if(idx !== -1) loadTrack(idx, true);
  });

  trackListEl.addEventListener('click', (e) => {
    const del = e.target.closest('[data-del]');
    if(del){
      const id = del.dataset.del;
      removeTrack(id);
    }
  });

  searchEl.addEventListener('input', render);

  // ---------- Adding / removing files ----------
  addBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => addFiles(e.target.files));

  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    if(e.dataTransfer.files && e.dataTransfer.files.length){
      addFiles(e.dataTransfer.files);
    }
  });

  async function addFiles(fileList){
    for(const file of fileList){
      if(!file.type.startsWith('audio/')) continue;
      const { artist, title } = guessArtistTitle(file.name);
      const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,9);
      const track = { id, name: file.name, artist, title, blob: file, duration: null };

      const tempUrl = URL.createObjectURL(file);
      const tempAudio = new Audio(tempUrl);
      tempAudio.addEventListener('loadedmetadata', async () => {
        track.duration = tempAudio.duration;
        URL.revokeObjectURL(tempUrl);
        await dbPut(track);
        render();
      });

      library.push(track);
      await dbPut(track);
    }
    render();
    fileInput.value = '';
  }

  async function removeTrack(id){
    const idx = libIndexOf(id);
    if(idx === -1) return;
    if(idx === currentIndex){
      audio.pause();
      audio.src = '';
      currentIndex = -1;
      npTitle.textContent = 'Nothing loaded yet';
      npArtist.textContent = 'ADD SOME MUSIC TO BEGIN';
      setDiscLabel('Groove', '');
    } else if(idx < currentIndex){
      currentIndex--;
    }
    library.splice(idx, 1);
    await dbDelete(id);
    render();
  }

  clearBtn.addEventListener('click', async () => {
    if(library.length === 0) return;
    if(!confirm('Remove all songs from your library? This cannot be undone.')) return;
    audio.pause();
    audio.src = '';
    currentIndex = -1;
    library = [];
    await dbClear();
    npTitle.textContent = 'Nothing loaded yet';
    npArtist.textContent = 'ADD SOME MUSIC TO BEGIN';
    setDiscLabel('Groove', '');
    render();
  });

  // ---------- Keyboard shortcuts ----------
  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); isPlaying ? pause() : play(); }
    if(e.code === 'ArrowRight' && e.shiftKey){ playNext(false); }
    if(e.code === 'ArrowLeft' && e.shiftKey){ playPrev(); }
  });

  // ---------- Init ----------
  (async function init(){
    try{
      db = await openDB();
      library = await dbAll();
      library.sort((a,b) => a.name.localeCompare(b.name));
    } catch(err){
      console.error('Storage error', err);
    }
    render();
  })();

})();
</script>
</body>
</html>
