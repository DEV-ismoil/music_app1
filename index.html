<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groove</title>
<style>
  :root{
    --bg: #14120F;
    --bg-panel: #1C1915;
    --bg-raised: #262119;
    --line: #33291E;
    --text: #ECE3D3;
    --text-dim: #9C8F7A;
    --accent: #C98A4B;
    --accent-dim: #7A5A34;
    --brass: #A9895A;
    --bg-glow: #201B14;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  body[data-theme="light"]{
    --bg:#F5F1E8; --bg-panel:#FFFFFF; --bg-raised:#F0EBDD; --line:#E1D9C8;
    --text:#2A2420; --text-dim:#8C8071; --accent:#B5652F; --accent-dim:#E3B98C; --brass:#B5652F;
    --bg-glow:#EFE7D6;
  }
  body[data-theme="matrix"]{
    --bg:#040604; --bg-panel:#060B06; --bg-raised:#0B140B; --line:#123312;
    --text:#B9FFC4; --text-dim:#4E9C5A; --accent:#00FF66; --accent-dim:#0C5C2A; --brass:#00CC55;
    --bg-glow:#04140A;
    --serif: var(--mono);
  }
  body[data-theme="galaxy"]{
    --bg:#0A0920; --bg-panel:#110E30; --bg-raised:#1A1544; --line:#2B2461;
    --text:#E9E5FF; --text-dim:#9089C6; --accent:#B98CFF; --accent-dim:#5D4B9C; --brass:#7FD9FF;
    --bg-glow:#160F3A;
  }
  body[data-theme="sunset"]{
    --bg:#241019; --bg-panel:#2E1420; --bg-raised:#3B1B2A; --line:#4C2334;
    --text:#FDEBDE; --text-dim:#C48D8F; --accent:#FF7A59; --accent-dim:#B85641; --brass:#FFB347;
    --bg-glow:#331222;
  }
  body[data-theme="ocean"]{
    --bg:#081820; --bg-panel:#0C2430; --bg-raised:#123240; --line:#1D4A5C;
    --text:#DFF4F7; --text-dim:#7FAAB8; --accent:#33B7C4; --accent-dim:#2A7E8A; --brass:#5FD3DD;
    --bg-glow:#0E3040;
  }
  body[data-theme="forest"]{
    --bg:#0F1710; --bg-panel:#152116; --bg-raised:#1C2E1D; --line:#2C4530;
    --text:#DCEFDA; --text-dim:#87A88A; --accent:#6FA85E; --accent-dim:#4C7A40; --brass:#9BC77E;
    --bg-glow:#182A18;
  }
  body[data-theme="cyberpunk"]{
    --bg:#0A0612; --bg-panel:#120A1E; --bg-raised:#1C0F30; --line:#3A1B58;
    --text:#F2E8FF; --text-dim:#9C7FC4; --accent:#FF2E9A; --accent-dim:#9C1E63; --brass:#00E5FF;
    --bg-glow:#1A0A2E;
  }
  body[data-theme="rosegold"]{
    --bg:#241A1C; --bg-panel:#2E2124; --bg-raised:#3A2A2D; --line:#4E3639;
    --text:#F8E7E2; --text-dim:#C39B94; --accent:#E8A798; --accent-dim:#B87A6D; --brass:#E3C08A;
    --bg-glow:#33232A;
  }
  body[data-theme="noir"]{
    --bg:#0A0A0A; --bg-panel:#121212; --bg-raised:#1B1B1B; --line:#2E2E2E;
    --text:#F2F2F2; --text-dim:#8A8A8A; --accent:#E8E8E8; --accent-dim:#5A5A5A; --brass:#CFCFCF;
    --bg-glow:#161616;
  }
  body[data-theme="coffee"]{
    --bg:#1C140F; --bg-panel:#251A13; --bg-raised:#2F2118; --line:#43301F;
    --text:#EFDFCB; --text-dim:#A98F72; --accent:#C08552; --accent-dim:#8A5C34; --brass:#D9A15C;
    --bg-glow:#28190F;
  }
  body[data-theme="ice"]{
    --bg:#EAF3F8; --bg-panel:#FFFFFF; --bg-raised:#E3EFF5; --line:#CBDFE9;
    --text:#1E3641; --text-dim:#6C93A3; --accent:#2E8FB0; --accent-dim:#A9D6E6; --brass:#2E8FB0;
    --bg-glow:#DCEEF5;
  }
  body[data-theme="lava"]{
    --bg:#150707; --bg-panel:#1F0A0A; --bg-raised:#2B0E0D; --line:#4A1610;
    --text:#FCE3D6; --text-dim:#B87A63; --accent:#FF4A23; --accent-dim:#B22E13; --brass:#FF9142;
    --bg-glow:#260C0A;
  }
  body[data-theme="amber"]{
    --bg:#0C0900; --bg-panel:#151000; --bg-raised:#1E1700; --line:#3A2C00;
    --text:#FFD98A; --text-dim:#B08A3E; --accent:#FFB000; --accent-dim:#B37D00; --brass:#FFC94D;
    --bg-glow:#1A1300;
    --serif: var(--mono);
  }
  body[data-theme="pastel"]{
    --bg:#F3EEFA; --bg-panel:#FFFFFF; --bg-raised:#ECE4F7; --line:#DCCDF0;
    --text:#4A3B5C; --text-dim:#9C87B5; --accent:#B48CE0; --accent-dim:#D9C4F0; --brass:#F0A8C8;
    --bg-glow:#EBE1F7;
  }
  /* ---- animated themes ---- */
  body[data-theme="aurora"]{
    --bg:#050B12; --bg-panel:#081521; --bg-raised:#0E2030; --line:#163044;
    --text:#DFF6F2; --text-dim:#7FB3AE; --accent:#4CE0B3; --accent-dim:#2E8F73; --brass:#7FD9FF;
    --bg-glow:#0A1B28;
  }
  body[data-theme="rain"]{
    --bg:#0A0E14; --bg-panel:#10151D; --bg-raised:#161C26; --line:#232B38;
    --text:#DCE4EE; --text-dim:#7A8798; --accent:#6FA8DC; --accent-dim:#3E6D96; --brass:#9FC1E0;
    --bg-glow:#121826;
  }
  body[data-theme="fireflies"]{
    --bg:#0A130A; --bg-panel:#0F1B0F; --bg-raised:#152615; --line:#213A21;
    --text:#E4F5DE; --text-dim:#87A87F; --accent:#C8FF8C; --accent-dim:#7FAA4E; --brass:#D4FF9E;
    --bg-glow:#101F10;
  }
  body[data-theme="snowfall"]{
    --bg:#0E1620; --bg-panel:#141F2C; --bg-raised:#1B2A3A; --line:#2C4258;
    --text:#EAF3FA; --text-dim:#8FAAC0; --accent:#BFE3FF; --accent-dim:#5C8FB8; --brass:#DFF1FF;
    --bg-glow:#182634;
  }
  body[data-theme="lavalamp"]{
    --bg:#160B12; --bg-panel:#20101A; --bg-raised:#2B1622; --line:#432036;
    --text:#FBE6F0; --text-dim:#C08AA6; --accent:#FF6A3D; --accent-dim:#B84A28; --brass:#FF9F5A;
    --bg-glow:#240F1C;
  }
  /* ---- interactive themes ---- */
  body[data-theme="nebula"]{
    --bg:#0B0714; --bg-panel:#130B20; --bg-raised:#1C112E; --line:#301C48;
    --text:#F0E6FF; --text-dim:#9E86C4; --accent:#D66BFF; --accent-dim:#8A46A8; --brass:#6BD6FF;
    --bg-glow:#180B26;
  }
  body[data-theme="fireworks"]{
    --bg:#070912; --bg-panel:#0C0F1C; --bg-raised:#121628; --line:#1E2340;
    --text:#F5EFDD; --text-dim:#8C88A8; --accent:#FFC24C; --accent-dim:#B8862F; --brass:#FF6B6B;
    --bg-glow:#0E1224;
  }
  body[data-theme="ripple"]{
    --bg:#071A1E; --bg-panel:#0C262B; --bg-raised:#123138; --line:#1D4750;
    --text:#E1F5F5; --text-dim:#7FB0B5; --accent:#4FD5D0; --accent-dim:#2E8F8C; --brass:#8CE8E0;
    --bg-glow:#0D2529;
  }
  body[data-theme="constellation"]{
    --bg:#060A18; --bg-panel:#0B1224; --bg-raised:#111A32; --line:#1E2A4A;
    --text:#E8ECFB; --text-dim:#7E8AB8; --accent:#8CA6FF; --accent-dim:#5468B0; --brass:#B8C6FF;
    --bg-glow:#0C1530;
  }
  body[data-theme="bubbles"]{
    --bg:#E6F6F7; --bg-panel:#FFFFFF; --bg-raised:#DDF1F2; --line:#C4E5E7;
    --text:#123A3D; --text-dim:#5E9296; --accent:#3FBFC4; --accent-dim:#A6E2E4; --brass:#3FBFC4;
    --bg-glow:#D6EFF0;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(1200px 800px at 20% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    overflow:hidden;
    transition: background .3s, color .3s;
  }
  ::selection{ background: var(--accent-dim); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  #fxCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:0;
    pointer-events:none;
  }

  .app{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns: 340px 1fr;
    height:100vh;
    transition: grid-template-columns .2s;
  }

  /* ---------- LIBRARY (left) ---------- */
  .library{
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
    transition: background .3s, border-color .3s;
  }
  .library-head{
    padding: 22px 20px 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .brand .accent-dot{ color: var(--accent); }
  .sub{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .search-row{
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .search-row input{
    width:100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--sans);
    outline:none;
  }
  .search-row input:focus{ border-color: var(--accent-dim); }
  .search-row input::placeholder{ color: var(--text-dim); }

  .add-row{
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    display:flex;
    gap:8px;
  }
  .btn{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text);
    padding: 9px 14px;
    cursor:pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover{ border-color: var(--accent-dim); color: var(--text); }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #1A1109;
  }
  .btn.primary:hover{ filter: brightness(1.08); }
  .add-row .btn{ flex:1; }

  .track-list{
    flex:1;
    overflow-y:auto;
    padding: 6px 0 20px 0;
  }
  .track-row{
    display:grid;
    grid-template-columns: 26px 1fr auto 26px;
    align-items:center;
    gap: 10px;
    padding: 10px 20px;
    cursor:pointer;
    border-left: 2px solid transparent;
    border-top: 2px solid transparent;
  }
  .track-row[draggable="true"]{ cursor: grab; }
  .track-row.dragging{ opacity: 0.35; }
  .track-row.drag-over{ border-top-color: var(--accent); }
  .track-row:hover{ background: rgba(127,127,127,0.08); }
  .track-row.active{
    background: rgba(201,138,75,0.12);
    border-left-color: var(--accent);
  }
  .track-num{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align:right;
  }
  .track-row.active .track-num{ color: var(--accent); }
  .track-meta{ min-width:0; }
  .track-title{
    font-size: 13.5px;
    color: var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-artist{
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-dur{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .track-del{
    opacity:0;
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    font-size: 15px;
    line-height:1;
  }
  .track-row:hover .track-del{ opacity:1; }
  .track-del:hover{ color: #D9694C; }

  .empty-lib{
    padding: 40px 24px;
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    line-height:1.6;
  }
  .empty-lib b{ color: var(--text); }

  /* ---------- STAGE (right) ---------- */
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px;
    min-width:0;
  }

  .stage-toolbar{
    position:absolute;
    top:22px;
    right:26px;
    display:flex;
    gap:8px;
    z-index:5;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--bg-raised);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent-dim); }
  .icon-btn.active{ color:var(--accent); border-color:var(--accent-dim); }
  .icon-btn svg{ width:16px;height:16px; }

  .popover{
    position:absolute;
    top:64px;
    right:26px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    min-width:190px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    display:none;
    z-index:10;
  }
  .popover.open{ display:block; }
  .popover-title{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .swatch-grid{ display:flex; flex-direction:column; gap:4px; max-height:340px; overflow-y:auto; padding-right:2px; }
  .theme-swatch{
    display:flex; align-items:center; gap:9px;
    background:none;border:1px solid transparent;border-radius:6px;
    padding:7px 8px;
    color:var(--text);
    font-size:12.5px;
    font-family:var(--sans);
    cursor:pointer;
    text-align:left;
  }
  .theme-swatch:hover{ background:var(--bg-raised); }
  .theme-swatch.active{ border-color:var(--accent-dim); background:var(--bg-raised); }
  .swatch-dot{ width:12px;height:12px;border-radius:50%; display:inline-block; flex-shrink:0; }
  .swatch-group-label{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 8px 2px 8px;
    opacity: 0.7;
  }

  .eq-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .eq-row:last-child{ margin-bottom:0; }
  .eq-row label{ width:42px; font-size:11px; color:var(--text-dim); font-family:var(--mono); }
  .eq-row input[type=range]{ flex:1; accent-color: var(--accent); }

  .sleep-options{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .sleep-options button{
    flex:1 1 40%;
    padding:7px 0;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--bg-raised);
    color:var(--text);
    font-size:12px;
    font-family:var(--sans);
    cursor:pointer;
  }
  .sleep-options button:hover{ border-color:var(--accent-dim); }
  .sleep-status{ font-family:var(--mono); font-size:11px; color:var(--accent); text-align:center; min-height:14px; }

  .turntable{
    position:relative;
    width: 400px;
    height: 360px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .plinth{
    position:absolute;
    width: 380px;
    height: 330px;
    top: 6px;
    left: 10px;
    border-radius: 14px;
    background: linear-gradient(160deg, #3A2E20 0%, #211809 55%, #150E06 100%);
    box-shadow:
      0 35px 70px -25px rgba(0,0,0,0.75),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -3px 8px rgba(0,0,0,0.5);
  }
  .plinth::before{
    content:'';
    position:absolute;
    inset: 10px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events:none;
  }
  .platter-mat{
    position:absolute;
    width: 306px;
    height: 306px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #050403 0%, #0C0A08 70%, #050403 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), inset 0 10px 30px rgba(0,0,0,0.6);
  }
  .disc-wrap{
    position:relative;
    width: 300px;
    height: 300px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .disc{
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #0E0C0A 0px, #0E0C0A 2px,
        #17140F 3px, #17140F 5px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin 9s linear infinite paused;
  }
  .disc.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .label{
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), #8A5B2E);
    background-size: cover;
    background-position: center;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    box-shadow: 0 0 0 2px #0E0C0A, inset 0 2px 6px rgba(255,255,255,0.15);
    padding: 14px;
    overflow:hidden;
  }
  .label.has-art{ padding:0; }
  .label-text{
    font-family: var(--serif);
    font-weight: bold;
    color: #1A1109;
    line-height: 1.15;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .label-artist{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(26,17,9,0.75);
    margin-top: 5px;
  }
  .spindle{
    position:absolute;
    width: 10px; height:10px;
    border-radius:50%;
    background:#0A0908;
    box-shadow: 0 0 0 2px #2A2419;
    z-index:4;
  }

  /* ---------- tonearm ---------- */
  .tonearm-base{
    position:absolute;
    top: 26px;
    right: 26px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4A3D2A, #17130A 75%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.15);
    z-index: 6;
  }
  .tonearm{
    position:absolute;
    top: 37px;
    right: 37px;
    width: 150px;
    height: 10px;
    transform-origin: 6px 4px;
    transform: rotate(-30deg);
    transition: transform 0.7s cubic-bezier(.4,0,.2,1);
    z-index: 6;
    pointer-events:none;
  }
  .tonearm.playing{ transform: rotate(4deg); }
  .tonearm-shaft{
    position:absolute;
    left: 4px; top: 3px;
    width: 128px; height: 4px;
    background: linear-gradient(90deg, #D9B87A, #8a7248);
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .headshell{
    position:absolute;
    left: 124px; top: -5px;
    width: 20px; height: 14px;
    background: linear-gradient(160deg, #2A2A2A, #0E0E0E);
    border-radius: 2px 5px 5px 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .headshell::after{
    content:'';
    position:absolute;
    right: -2px; top: 5px;
    width: 4px; height: 6px;
    background: #C98A4B;
    border-radius: 1px;
  }

  @keyframes turntableSpin{ to{ transform: rotate(360deg); } }

  .now-playing{
    margin-top: 30px;
    text-align:center;
    max-width: 480px;
  }
  .np-title{
    font-family: var(--serif);
    font-size: 24px;
    color: var(--text);
  }
  .np-artist{
    font-family: var(--mono);

  .progress-wrap{

    position:absolute; left:0; top:0; bottom:0;

    border-radius: 2px;
    width:0%;
  }

    position:absolute;
    top:50%;
    width:11px; height:11px;
    background: var(--text);
    border-radius:50%;
    transform: translate(-50%,-50%);
    left:0%;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.3);
  }

  .controls{
    margin-top: 26px;
    display:flex;
    align-items:center;
    gap: 22px;
  }
  .ctl-btn{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: color .15s, transform .1s;
  }
  .ctl-btn:hover{ color: var(--text); }
  .ctl-btn:active{ transform: scale(0.92); }
  .ctl-btn.toggled{ color: var(--accent); }
  .ctl-btn svg{ width:18px; height:18px; }
  .play-btn{
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #1A1109;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px -6px rgba(201,138,75,0.6);
  }
  .play-btn:hover{ filter: brightness(1.08); color:#1A1109; }
  .play-btn svg{ width:20px; height:20px; }

  .volume-row{
    margin-top: 22px;
    display:flex;
    align-items:center;
    gap: 10px;
    color: var(--text-dim);
  }
  .volume-row svg{ width:15px; height:15px; }
  .vol-bar{
    width: 100px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    position:relative;
    cursor:pointer;
  }
  .vol-fill{
    position:absolute; left:0; top:0; bottom:0;
    background: var(--brass);
    border-radius: 2px;
    width: 70%;
  }

  .hint{
    position:absolute;
    bottom: 22px;
    font-family: var(--mono);
    font-size: 10.5px;

    color: var(--text-dim);

  input[type=file]{ display:none; }

  /* ---------- MINI PLAYER MODE ---------- */

  body.mini-mode .stage{ padding:16px; }

<script>
(function(){
  // ---------- IndexedDB storage ----------
  const DB_NAME = 'groove-player';
  const DB_VERSION = 2;
  const STORE = 'tracks';
  const SETTINGS_STORE = 'settings';
  let db;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)){
          d.createObjectStore(STORE, { keyPath: 'id' });
        }
        if(!d.objectStoreNames.contains(SETTINGS_STORE)){
          d.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
        }
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }

  function dbAddTrack(track){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(track);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function dbAll(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function dbDelete(id){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function dbClear(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function dbSaveSetting(key, val){
    if(!db) return;
    const tx = db.transaction(SETTINGS_STORE, 'readwrite');
    tx.objectStore(SETTINGS_STORE).put({ key, val });
  }

  function dbGetSetting(key){
    return new Promise((resolve) => {
      if(!db) return resolve(null);
      const tx = db.transaction(SETTINGS_STORE, 'readonly');
      const req = tx.objectStore(SETTINGS_STORE).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.val : null);
      req.onerror = () => resolve(null);
    });
  }

  // ---------- ID3 Tag Parser ----------
  function extractId3Tags(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const buffer = e.target.result;
        const dv = new DataView(buffer);
        if (dv.byteLength < 10) return resolve(null);
        if (dv.getUint8(0) !== 0x49 || dv.getUint8(1) !== 0x44 || dv.getUint8(2) !== 0x33) {
          return resolve(null);
        }
        const version = dv.getUint8(3);
        const tagSize = ((dv.getUint8(6) & 0x7f) << 21) |
                         ((dv.getUint8(7) & 0x7f) << 14) |
                         ((dv.getUint8(8) & 0x7f) << 7) |
                         (dv.getUint8(9) & 0x7f);
        let offset = 10;
        let title = '', artist = '';
        while (offset < tagSize + 10 && offset < dv.byteLength - 10) {
          let frameID = '';
          for (let i = 0; i < 4; i++) {
            frameID += String.fromCharCode(dv.getUint8(offset + i));
          }
          if (frameID.charCodeAt(0) === 0) break;
          let frameSize = 0;
          if (version === 4) {
            frameSize = ((dv.getUint8(offset + 4) & 0x7f) << 21) |
                        ((dv.getUint8(offset + 5) & 0x7f) << 14) |
                        ((dv.getUint8(offset + 6) & 0x7f) << 7) |
                        (dv.getUint8(offset + 7) & 0x7f);
          } else {
            frameSize = dv.getUint32(offset + 4);
          }
          if (frameSize <= 0 || offset + 10 + frameSize > dv.byteLength) break;
          
          if (frameID === 'TIT2' || frameID === 'TPE1') {
            const encoding = dv.getUint8(offset + 10);
            let textData = new Uint8Array(buffer, offset + 11, frameSize - 1);
            let str = '';
            if (encoding === 1 || encoding === 2) { // UTF-16
              let decoder = new TextDecoder('utf-16');
              str = decoder.decode(textData);
            } else if (encoding === 3) { // UTF-8
              let decoder = new TextDecoder('utf-8');
              str = decoder.decode(textData);
            } else { // ISO-8859-1
              for (let k = 0; k < textData.length; k++) {
                if (textData[k] === 0) break;
                str += String.fromCharCode(textData[k]);
              }
            }
            str = str.replace(/\0/g, '').trim();
            if (frameID === 'TIT2') title = str;
            if (frameID === 'TPE1') artist = str;
          }
          offset += 10 + frameSize;
        }
        resolve({ title, artist });
      };
      reader.onerror = () => resolve(null);
      reader.readAsArrayBuffer(file.slice(0, 128 * 1024));
    });
  }

  function guessArtistTitle(filename) {
    let name = filename.replace(/\.[^/.]+$/, "");
    let parts = name.split(" - ");
    if (parts.length >= 2) {
      return { artist: parts[0].trim(), title: parts.slice(1).join(" - ").trim() };
    }
    return { artist: "Unknown Artist", title: name };
  }

  // ---------- Audio Engine ----------
  let library = [];
  let currentIndex = -1;
  let audioCtx, audioSource, gainNode, bassFilter, midFilter, trebleFilter, analyser;
  const audio = new Audio();
  audio.crossOrigin = "anonymous";

  let isShuffle = false;
  let isRepeat = false;
  let currentTheme = 'vinyl';

  function initAudioNodes() {
    if (audioCtx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    audioCtx = new AudioCtx();
    
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;

    gainNode = audioCtx.createGain();

    bassFilter = audioCtx.createBiquadFilter();
    bassFilter.type = 'lowshelf';
    bassFilter.frequency.value = 250;

    midFilter = audioCtx.createBiquadFilter();
    midFilter.type = 'peaking';
    midFilter.frequency.value = 1500;
    midFilter.Q.value = 1;

    trebleFilter = audioCtx.createBiquadFilter();
    trebleFilter.type = 'highshelf';
    trebleFilter.frequency.value = 4000;

    audioSource = audioCtx.createMediaElementSource(audio);
    audioSource.connect(bassFilter);
    bassFilter.connect(midFilter);
    midFilter.connect(trebleFilter);
    trebleFilter.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  // ---------- State & UI Rendering ----------
  const trackListEl = document.getElementById('trackList');
  const searchInput = document.getElementById('search');
  const npTitle = document.getElementById('npTitle');
  const npArtist = document.getElementById('npArtist');
  const discText = document.getElementById('discText');
  const discArtist = document.getElementById('discArtist');
  const disc = document.getElementById('disc');
  const tonearm = document.getElementById('tonearm');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const bar = document.getElementById('bar');
  const barFill = document.getElementById('barFill');
  const barKnob = document.getElementById('barKnob');
  const volBar = document.getElementById('volBar');
  const volFill = document.getElementById('volFill');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');

  function formatTime(s) {
    if (isNaN(s) || !isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
  }

  function render() {
    const q = searchInput.value.toLowerCase().trim();
    trackListEl.innerHTML = '';

    if (library.length === 0) {
      trackListEl.innerHTML = `<div class="empty-lib"><b>Your library is empty</b><br>Click "+ Add music files" or drop audio files here.</div>`;
      return;
    }

    library.forEach((item, idx) => {
      if (q && !item.title.toLowerCase().includes(q) && !item.artist.toLowerCase().includes(q)) {
        return;
      }
      const row = document.createElement('div');
      row.className = 'track-row' + (idx === currentIndex ? ' active' : '');
      row.draggable = true;
      row.dataset.index = idx;

      row.innerHTML = `
        <div class="track-num">${idx + 1}</div>
        <div class="track-meta">
          <div class="track-title">${escapeHtml(item.title)}</div>
          <div class="track-artist">${escapeHtml(item.artist)}</div>
        </div>
        <div class="track-dur">--:--</div>
        <button class="track-del" title="Delete">✕</button>
      `;

      row.addEventListener('dblclick', () => playTrack(idx));
      row.querySelector('.track-del').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTrack(idx);
      });

      // Drag & Drop reorder
      row.addEventListener('dragstart', (e) => {
        row.classList.add('dragging');
        e.dataTransfer.setData('text/plain', idx);
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
        const toIdx = idx;
        if (fromIdx !== toIdx) reorderTracks(fromIdx, toIdx);
      });

      trackListEl.appendChild(row);
    });
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function reorderTracks(from, to) {
    const moved = library.splice(from, 1)[0];
    library.splice(to, 0, moved);
    if (currentIndex === from) currentIndex = to;
    else if (from < currentIndex && to >= currentIndex) currentIndex--;
    else if (from > currentIndex && to <= currentIndex) currentIndex++;
    render();
    saveOrder();
  }

  async function saveOrder() {
    await dbClear();
    for (let item of library) {
      await dbAddTrack(item);
    }
  }

  async function deleteTrack(idx) {
    const item = library[idx];
    if (!item) return;
    await dbDelete(item.id);
    library.splice(idx, 1);
    if (currentIndex === idx) {
      audio.pause();
      currentIndex = -1;
      npTitle.textContent = "Nothing loaded yet";
      npArtist.textContent = "ADD SOME MUSIC TO BEGIN";
      discText.textContent = "Groove";
      discArtist.textContent = "";
      disc.classList.remove('spinning');
      tonearm.classList.remove('playing');
    } else if (currentIndex > idx) {
      currentIndex--;
    }
    render();
  }

  function playTrack(idx) {
    if (idx < 0 || idx >= library.length) return;
    initAudioNodes();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    currentIndex = idx;
    const item = library[idx];
    const url = URL.createObjectURL(item.blob);
    audio.src = url;
    audio.play();

    npTitle.textContent = item.title;
    npArtist.textContent = item.artist;
    discText.textContent = item.title;
    discArtist.textContent = item.artist;

    disc.classList.add('spinning');
    tonearm.classList.add('playing');
    updatePlayIcon(true);
    render();
  }

  function togglePlay() {
    if (currentIndex === -1 && library.length > 0) {
      playTrack(0);
      return;
    }
    if (audio.paused) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play();
      disc.classList.add('spinning');
      tonearm.classList.add('playing');
      updatePlayIcon(true);
    } else {
      audio.pause();
      disc.classList.remove('spinning');
      tonearm.classList.remove('playing');
      updatePlayIcon(false);
    }
  }

  function updatePlayIcon(isPlaying) {
    if (isPlaying) {
      playIcon.innerHTML = `<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>`;
    } else {
      playIcon.innerHTML = `<polygon points="6 3 20 12 6 21 6 3"></polygon>`;
    }
  }

  function nextTrack() {
    if (library.length === 0) return;
    if (isShuffle) {
      let nextIdx = Math.floor(Math.random() * library.length);
      playTrack(nextIdx);
    } else {
      let nextIdx = (currentIndex + 1) % library.length;
      playTrack(nextIdx);
    }
  }

  function prevTrack() {
    if (library.length === 0) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }
    let prevIdx = (currentIndex - 1 + library.length) % library.length;
    playTrack(prevIdx);
  }

  // Audio Event Listeners
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    barFill.style.width = pct + '%';
    barKnob.style.left = pct + '%';
    curTimeEl.textContent = formatTime(audio.currentTime);
    durTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => {
    if (isRepeat) {
      audio.currentTime = 0;
      audio.play();
    } else {
      nextTrack();
    }
  });

  // Progress Bar Drag/Seek
  let isSeeking = false;
  bar.addEventListener('mousedown', (e) => {
    isSeeking = true;
    seek(e);
  });
  window.addEventListener('mousemove', (e) => { if (isSeeking) seek(e); });
  window.addEventListener('mouseup', () => { isSeeking = false; });

  function seek(e) {
    const rect = bar.getBoundingClientRect();
    const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (audio.duration) {
      audio.currentTime = pos * audio.duration;
    }
  }

  // Volume Bar
  let isVolDragging = false;
  volBar.addEventListener('mousedown', (e) => {
    isVolDragging = true;
    setVolume(e);
  });
  window.addEventListener('mousemove', (e) => { if (isVolDragging) setVolume(e); });
  window.addEventListener('mouseup', () => { isVolDragging = false; });

  function setVolume(e) {
    const rect = volBar.getBoundingClientRect();
    const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.volume = pos;
    volFill.style.width = (pos * 100) + '%';
  }

  // Controls
  playBtn.addEventListener('click', togglePlay);
  document.getElementById('nextBtn').addEventListener('click', nextTrack);
  document.getElementById('prevBtn').addEventListener('click', prevTrack);

  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('toggled', isShuffle);
  });

  repeatBtn.addEventListener('click', () => {
    isRepeat = !isRepeat;
    repeatBtn.classList.toggle('toggled', isRepeat);
  });

  searchInput.addEventListener('input', render);

  document.getElementById('clearBtn').addEventListener('click', async () => {
    if (confirm("Clear all songs from your local storage?")) {
      await dbClear();
      library = [];
      currentIndex = -1;
      audio.pause();
      npTitle.textContent = "Nothing loaded yet";
      npArtist.textContent = "ADD SOME MUSIC TO BEGIN";
      discText.textContent = "Groove";
      discArtist.textContent = "";
      disc.classList.remove('spinning');
      tonearm.classList.remove('playing');
      render();
    }
  });

  // --------- Adding / removing files ---------

  async function addFiles(fileList){
    for(const file of fileList){
      // Workaround for iOS Safari empty MIME type
      const fileType = file.type || 'audio/mpeg';
      const hasAudioExt = /\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(file.name);

      if (!fileType.startsWith('audio/') && !hasAudioExt) continue;

      let { artist, title } = guessArtistTitle(file.name);

      try {
        // 1. Read array buffer directly (iOS friendly)
        const arrayBuffer = await file.arrayBuffer();
        
        // 2. Safely attempt ID3 parsing without letting it crash the upload
        try {
          const tags = await extractId3Tags(file);
          if (tags && tags.title) title = tags.title;
          if (tags && tags.artist) artist = tags.artist;
        } catch (tagErr) {
          console.warn('ID3 tag reading skipped on iOS:', tagErr);
        }

        // 3. Store pure Blob created from the ArrayBuffer into IndexedDB
        const audioBlob = new Blob([arrayBuffer], { type: fileType });

        await dbAddTrack({
          id: Date.now() + Math.random(),
          name: file.name,
          artist: artist,
          title: title,
          blob: audioBlob
        });
      } catch (err) {
        console.error('Error adding track on iOS:', err);
      }
    }

    library = await dbAll();
    render();
  }

  // Attach event listeners AFTER function definition
  const addBtn = document.getElementById('addBtn');
  const fileInput = document.getElementById('file-input');

  addBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async (e) => {
    if (!e.target.files.length) return;
    await addFiles(e.target.files);
    fileInput.value = '';
  });

  // Drag and drop onto stage/window
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files.length) {
      await addFiles(e.dataTransfer.files);
    }
  });

  // ---------- Popovers & Panels ----------
  const themeBtn = document.getElementById('themeBtn');
  const themePanel = document.getElementById('themePanel');
  const eqBtn = document.getElementById('eqBtn');
  const eqPanel = document.getElementById('eqPanel');
  const sleepBtn = document.getElementById('sleepBtn');
  const sleepPanel = document.getElementById('sleepPanel');
  const miniBtn = document.getElementById('miniBtn');

  function closeAllPopovers() {
    themePanel.classList.remove('open');
    eqPanel.classList.remove('open');
    sleepPanel.classList.remove('open');
  }

  themeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = themePanel.classList.contains('open');
    closeAllPopovers();
    if (!wasOpen) themePanel.classList.add('open');
  });

  eqBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = eqPanel.classList.contains('open');
    closeAllPopovers();
    if (!wasOpen) eqPanel.classList.add('open');
  });

  sleepBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = sleepPanel.classList.contains('open');
    closeAllPopovers();
    if (!wasOpen) sleepPanel.classList.add('open');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.popover') && !e.target.closest('.icon-btn')) {
      closeAllPopovers();
    }
  });

  miniBtn.addEventListener('click', () => {
    document.body.classList.toggle('mini-mode');
    miniBtn.classList.toggle('active');
  });

  // Theme selection
  document.querySelectorAll('.theme-swatch').forEach(btn => {
    btn.addEventListener('click', () => {
      const theme = btn.dataset.theme;
      setTheme(theme);
    });
  });

  function setTheme(t) {
    currentTheme = t;
    if (t === 'vinyl') {
      document.body.removeAttribute('data-theme');
    } else {
      document.body.setAttribute('data-theme', t);
    }
    document.querySelectorAll('.theme-swatch').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === t);
    });
    dbSaveSetting('theme', t);
  }

  // Equalizer Logic
  const eqBass = document.getElementById('eqBass');
  const eqMid = document.getElementById('eqMid');
  const eqTreble = document.getElementById('eqTreble');

  eqBass.addEventListener('input', (e) => { if (bassFilter) bassFilter.gain.value = e.target.value; });
  eqMid.addEventListener('input', (e) => { if (midFilter) midFilter.gain.value = e.target.value; });
  eqTreble.addEventListener('input', (e) => { if (trebleFilter) trebleFilter.gain.value = e.target.value; });

  document.getElementById('eqResetBtn').addEventListener('click', () => {
    eqBass.value = 0;
    eqMid.value = 0;
    eqTreble.value = 0;
    if (bassFilter) bassFilter.gain.value = 0;
    if (midFilter) midFilter.gain.value = 0;
    if (trebleFilter) trebleFilter.gain.value = 0;
  });

  // Sleep Timer Logic
  let sleepTimer = null;
  let sleepEndTime = 0;
  const sleepStatus = document.getElementById('sleepStatus');

  document.querySelectorAll('.sleep-options button').forEach(btn => {
    btn.addEventListener('click', () => {
      const min = parseInt(btn.dataset.min, 10);
      if (sleepTimer) clearTimeout(sleepTimer);
      if (min === 0) {
        sleepStatus.textContent = '';
        sleepBtn.classList.remove('active');
        return;
      }
      sleepStatus.textContent = `Stopping in ${min} minutes`;
      sleepBtn.classList.add('active');
      sleepTimer = setTimeout(() => {
        audio.pause();
        disc.classList.remove('spinning');
        tonearm.classList.remove('playing');
        updatePlayIcon(false);
        sleepStatus.textContent = '';
        sleepBtn.classList.remove('active');
      }, min * 60 * 1000);
    });
  });

  // ---------- Canvas Visualizations & Interactive Physics ----------
  const canvas = document.getElementById('fxCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let mouseX = canvas.width / 2;
  let mouseY = canvas.height / 2;
  let ripples = [];
  let fireworks = [];

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  window.addEventListener('click', (e) => {
    if (currentTheme === 'ripple') {
      ripples.push({ x: e.clientX, y: e.clientY, r: 0, alpha: 1 });
    } else if (currentTheme === 'fireworks') {
      createFirework(e.clientX, e.clientY);
    }
  });

  function createFirework(x, y) {
    const count = 30;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i;
      const speed = Math.random() * 4 + 2;
      fireworks.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color: `hsl(${Math.random() * 360}, 100%, 60%)`
      });
    }
  }

  // Particle sets for dynamic visual themes
  const particles = Array.from({ length: 60 }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1.5,
    size: Math.random() * 3 + 1
  }));

  function drawFX() {
    requestAnimationFrame(drawFX);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let audioFreq = 0;
    if (analyser) {
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      audioFreq = sum / data.length;
    }

    if (currentTheme === 'rain') {
      ctx.strokeStyle = 'rgba(111, 168, 220, 0.4)';
      ctx.lineWidth = 1;
      particles.forEach(p => {
        p.y += p.size * 3 + (audioFreq * 0.05);
        if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x, p.y + 12);
        ctx.stroke();
      });
    } else if (currentTheme === 'snowfall') {
      ctx.fillStyle = 'rgba(234, 243, 250, 0.6)';
      particles.forEach(p => {
        p.y += p.size * 0.5;
        p.x += Math.sin(p.y * 0.01);
        if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
    } else if (currentTheme === 'fireflies') {
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        const glow = Math.sin(Date.now() * 0.003 + p.x) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(200, 255, 140, ${glow * 0.8})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size + (audioFreq * 0.02), 0, Math.PI * 2);
        ctx.fill();
      });
    } else if (currentTheme === 'constellation') {
      ctx.fillStyle = 'rgba(140, 166, 255, 0.7)';
      ctx.strokeStyle = 'rgba(140, 166, 255, 0.15)';
      particles.forEach((p, i) => {
        p.x += p.vx * 0.5;
        p.y += p.vy * 0.5;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 100) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      });
    } else if (currentTheme === 'ripple') {
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.r += 2 + (audioFreq * 0.05);
        r.alpha -= 0.015;
        if (r.alpha <= 0) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.strokeStyle = `rgba(79, 213, 208, ${r.alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (currentTheme === 'fireworks') {
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.05; // gravity
        f.alpha -= 0.015;
        if (f.alpha <= 0) {
          fireworks.splice(i, 1);
          continue;
        }
        ctx.fillStyle = f.color;
        ctx.globalAlpha = f.alpha;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    } else if (currentTheme === 'bubbles') {
      ctx.fillStyle = 'rgba(63, 191, 196, 0.25)';
      particles.forEach(p => {
        p.y -= p.size * 0.8;
        if (p.y < -10) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(p.y * 0.02) * 10, p.y, p.size * 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  }
  drawFX();

  // Initialization
  openDB().then(async () => {
    library = await dbAll();
    const savedTheme = await dbGetSetting('theme');
    if (savedTheme) setTheme(savedTheme);
    render();
  }).catch(err => console.error('DB Open Failed:', err));

})();
</script>
</body>
</html>
