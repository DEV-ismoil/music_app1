<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groove</title>
<style>
  :root {
    --bg-main: #121214;
    --bg-card: #1e1e24;
    --bg-card-hover: #2a2a32;
    --accent: #ff4757;
    --accent-glow: rgba(255, 71, 87, 0.4);
    --text-main: #f1f2f6;
    --text-muted: #a4b0be;
    --border-color: #2f3542;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background-color: #0d0d0f;
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 20px;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 1px;
  }

  .nav-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .nav-item {
    padding: 10px 14px;
    border-radius: 8px;
    color: var(--text-muted);
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-item:hover, .nav-item.active {
    background-color: var(--bg-card);
    color: var(--text-main);
  }

  .nav-item.active {
    border-left: 4px solid var(--accent);
  }

  /* Main Content */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .top-bar {
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
  }

  .upload-btn {
    background: linear-gradient(135deg, #ff4757, #ff6b81);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 4px 15px var(--accent-glow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: inline-block;
  }

  .upload-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  input[type="file"] {
    display: none;
  }

  .search-bar input {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 20px;
    outline: none;
    width: 250px;
  }

  .content-body {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
  }

  .section-title {
    font-size: 1.2rem;
    margin-bottom: 15px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Track List View */
  .track-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .track-item {
    display: grid;
    grid-template-columns: 40px 2fr 2fr 1fr 40px;
    align-items: center;
    padding: 10px 16px;
    background-color: var(--bg-card);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .track-item:hover {
    background-color: var(--bg-card-hover);
  }

  .track-item.playing {
    border: 1px solid var(--accent);
    background-color: var(--bg-card-hover);
  }

  .track-item .title {
    font-weight: 600;
    color: var(--text-main);
  }

  .track-item .artist {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .track-item .duration {
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .delete-btn {
    color: var(--text-muted);
    cursor: pointer;
    text-align: center;
    font-size: 1.1rem;
    transition: color 0.2s;
  }

  .delete-btn:hover {
    color: var(--accent);
  }

  /* Player Controls (Bottom Bar) */
  .player-bar {
    height: 90px;
    background-color: #0d0d0f;
    border-top: 1px solid var(--border-color);
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    padding: 0 30px;
    position: relative;
    z-index: 10;
  }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .album-art-disc {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #2f3542;
    background-size: cover;
    background-position: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    animation: spin 10s linear infinite;
    animation-play-state: paused;
    border: 2px solid #57606f;
  }

  .album-art-disc.playing {
    animation-play-state: running;
  }

  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  .track-info .np-title {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 2px;
  }

  .track-info .np-artist {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .controls-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .buttons {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1.2rem;
    transition: color 0.2s;
  }

  .btn:hover {
    color: var(--text-main);
  }

  .btn-play {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: var(--text-main);
    color: var(--bg-main);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: transform 0.2s;
  }

  .btn-play:hover {
    transform: scale(1.05);
    color: var(--bg-main);
  }

  .btn.active {
    color: var(--accent);
  }

  .progress-container {
    width: 100%;
    max-width: 500px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background-color: var(--border-color);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background-color: var(--accent);
    border-radius: 2px;
    width: 0%;
  }

  .volume-container {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
  }

  .volume-slider {
    width: 100px;
    accent-color: var(--accent);
  }

  /* Equalizer Canvas */
  #visualizer {
    position: absolute;
    bottom: 90px;
    left: 0;
    width: 100%;
    height: 120px;
    pointer-events: none;
    opacity: 0.15;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <span>&#9835;</span> Groove
    </div>
    <div class="nav-group">
      <div class="nav-item active" onclick="switchView('library')">Library</div>
      <div class="nav-item" onclick="switchView('playlists')">Playlists</div>
      <div class="nav-item" onclick="switchView('favorites')">Favorites</div>
    </div>
  </div>

  <!-- Main Area -->
  <div class="main-content">
    <div class="top-bar">
      <!-- Expanded accept attribute for standard iOS/Safari audio support -->
      <label class="upload-btn">
        + Add Songs
        <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,audio/mpeg,audio/mp4,audio/aac,audio/wav,audio/x-m4a" multiple>
      </label>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search library..." oninput="filterTracks()">
      </div>
    </div>

    <div class="content-body" id="contentBody">
      <div class="section-title">All Tracks</div>
      <div class="track-list" id="trackList"></div>
    </div>

    <canvas id="visualizer"></canvas>

    <!-- Player Bar -->
    <div class="player-bar">
      <div class="now-playing">
        <div class="album-art-disc" id="disc"></div>
        <div class="track-info">
          <div class="np-title" id="npTitle">Select a track</div>
          <div class="np-artist" id="npArtist">---</div>
        </div>
      </div>

      <div class="controls-center">
        <div class="buttons">
          <button class="btn" id="shuffleBtn" onclick="toggleShuffle()">&#128256;</button>
          <button class="btn" onclick="playPrev()">&#9198;</button>
          <button class="btn btn-play" id="playBtn" onclick="togglePlay()">&#9654;</button>
          <button class="btn" onclick="playNext(false)">&#9197;</button>
          <button class="btn" id="repeatBtn" onclick="toggleRepeat()">&#128257;</button>
        </div>
        <div class="progress-container">
          <span id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar" onclick="seek(event)">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="volume-container">
        <span>&#128066;</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" oninput="adjustVolume()">
      </div>
    </div>
  </div>

  <script>
    // --- Database Setup (IndexedDB for Persistent Storage) ---
    let db;
    const request = indexedDB.open("GrooveMusicDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("tracks")) {
        db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      loadLibraryFromDB();
    };

    // --- Audio Logic & State ---
    let library = [];
    let filteredLibrary = [];
    let currentIndex = -1;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    const audio = new Audio();
    let objectUrl = null;

    // Web Audio API Elements for Visualizer
    let audioCtx, analyser, source, canvas, canvasCtx;

    // DOM Elements
    const trackListEl = document.getElementById('trackList');
    const playBtn = document.getElementById('playBtn');
    const npTitle = document.getElementById('npTitle');
    const npArtist = document.getElementById('npArtist');
    const disc = document.getElementById('disc');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    // --- Event Listeners ---
    document.getElementById('fileInput').addEventListener('change', handleFileUpload);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', handleTrackEnd);

    // --- iOS Media Session Helper ---
    function updateMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || 'Unknown Title',
          artist: track.artist || 'Unknown Artist',
          album: 'Groove',
          artwork: track.art ? [{ src: URL.createObjectURL(track.art), sizes: '512x512', type: track.art.type }] : []
        });

        navigator.mediaSession.setActionHandler('play', () => play());
        navigator.mediaSession.setActionHandler('pause', () => pause());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext(false));
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime && audio.duration) {
            audio.currentTime = details.seekTime;
          }
        });
      }
    }

    // --- Upload and Parsing Logic ---
    async function handleFileUpload(e) {
      const files = Array.from(e.target.files);
      for (const file of files) {
        const metadata = await parseTags(file);
        const trackData = {
          blob: file,
          title: metadata.title || file.name.replace(/\.[^/.]+$/, ""),
          artist: metadata.artist || "Unknown Artist",
          album: metadata.album || "Unknown Album",
          duration: 0, 
          art: metadata.art || null,
          isFavorite: false
        };
        saveTrackToDB(trackData);
      }
    }

    function parseTags(file) {
      return new Promise((resolve) => {
        if (!window.jsmediatags) {
          resolve({});
          return;
        }
        window.jsmediatags.read(file, {
          onSuccess: (tag) => {
            const tags = tag.tags;
            let artBlob = null;
            if (tags.picture) {
              const { data, format } = tags.picture;
              let base64String = "";
              for (let i = 0; i < data.length; i++) {
                base64String += String.fromCharCode(data[i]);
              }
              artBlob = new Blob([new Uint8Array(data)], { type: format });
            }
            resolve({
              title: tags.title,
              artist: tags.artist,
              album: tags.album,
              art: artBlob
            });
          },
          onError: () => resolve({})
        });
      });
    }

    // --- IndexedDB Operations ---
    function saveTrackToDB(track) {
      const tx = db.transaction("tracks", "readwrite");
      const store = tx.objectStore("tracks");
      store.add(track);
      tx.oncomplete = () => loadLibraryFromDB();
    }

    function loadLibraryFromDB() {
      const tx = db.transaction("tracks", "readonly");
      const store = tx.objectStore("tracks");
      const request = store.getAll();
      request.onsuccess = () => {
        library = request.result;
        filteredLibrary = [...library];
        render();
      };
    }

    function deleteTrack(id, e) {
      e.stopPropagation();
      const tx = db.transaction("tracks", "readwrite");
      const store = tx.objectStore("tracks");
      store.delete(id);
      tx.oncomplete = () => loadLibraryFromDB();
    }

    // --- Core Player Functions ---
    function loadTrack(idx, autoplay = true) {
      if (idx < 0 || idx >= library.length) return;
      currentIndex = idx;
      const t = library[idx];

      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(t.blob);
      audio.src = objectUrl;

      npTitle.textContent = t.title;
      npArtist.textContent = t.artist;
      setDiscVisual(t);

      // Update iOS metadata & background media controls
      updateMediaSession(t);

      render();

      if (autoplay) {
        ensureAudioGraph();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        play();
      }
    }

    function play() {
      if (currentIndex === -1 && library.length > 0) {
        loadTrack(0, true);
        return;
      }
      audio.play().then(() => {
        isPlaying = true;
        playBtn.innerHTML = "&#10074;&#10074;";
        disc.classList.add('playing');
      }).catch(e => console.log(e));
    }

    function pause() {
      audio.pause();
      isPlaying = false;
      playBtn.innerHTML = "&#9654;";
      disc.classList.remove('playing');
    }

    function togglePlay() {
      if (isPlaying) pause();
      else play();
    }

    function playNext(auto = false) {
      if (isShuffle) {
        let rand = Math.floor(Math.random() * library.length);
        loadTrack(rand, true);
      } else {
        if (currentIndex < library.length - 1) {
          loadTrack(currentIndex + 1, true);
        } else if (isRepeat || auto) {
          loadTrack(0, true);
        }
      }
    }

    function playPrev() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else if (currentIndex > 0) {
        loadTrack(currentIndex - 1, true);
      }
    }

    function handleTrackEnd() {
      if (isRepeat) {
        audio.currentTime = 0;
        play();
      } else {
        playNext(true);
      }
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
    }

    function adjustVolume() {
      audio.volume = document.getElementById('volumeSlider').value;
    }

    function updateProgress() {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    }

    function seek(e) {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * audio.duration;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function setDiscVisual(track) {
      if (track.art) {
        const url = URL.createObjectURL(track.art);
        disc.style.backgroundImage = `url(${url})`;
      } else {
        disc.style.backgroundImage = 'none';
      }
    }

    // --- UI Rendering ---
    function render() {
      trackListEl.innerHTML = "";
      filteredLibrary.forEach((t) => {
        const originalIndex = library.findIndex(item => item.id === t.id);
        const item = document.createElement('div');
        item.className = `track-item ${originalIndex === currentIndex ? 'playing' : ''}`;
        item.onclick = () => loadTrack(originalIndex, true);

        item.innerHTML = `
          <div>${originalIndex === currentIndex ? '&#9835;' : '&#9654;'}</div>
          <div class="title">${t.title}</div>
          <div class="artist">${t.artist}</div>
          <div class="duration">${t.album}</div>
          <div class="delete-btn" onclick="deleteTrack(${t.id}, event)">&#128465;</div>
        `;
        trackListEl.appendChild(item);
      });
    }

    function filterTracks() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      filteredLibrary = library.filter(t => 
        t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
      );
      render();
    }

    function switchView(view) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      event.target.classList.add('active');
      if (view === 'favorites') {
        filteredLibrary = library.filter(t => t.isFavorite);
      } else {
        filteredLibrary = [...library];
      }
      render();
    }

    // --- Visualizer Integration (Web Audio API) ---
    function ensureAudioGraph() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      source = audioCtx.createMediaElementSource(audio);

      // Routing fix for iOS background audio:
      source.connect(audioCtx.destination);
      source.connect(analyser);

      analyser.fftSize = 64;
      canvas = document.getElementById('visualizer');
      canvasCtx = canvas.getContext('2d');
      
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      drawVisualizer();
    }

    function resizeCanvas() {
      if(!canvas) return;
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = 120;
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let barHeight;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        barHeight = (dataArray[i] / 255) * canvas.height;
        canvasCtx.fillStyle = '#ff4757';
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth;
      }
    }
  </script>
</body>
</html>
