<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Groove Mobile</title>
<style>
  :root{
    --bg: #0F0E0D;
    --bg-panel: #181614;
    --line: #2B251F;
    --text: #F2EBDC;
    --text-dim: #9C9080;
    --accent: #D98E4A;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh; display:flex; flex-direction:column; justify-content:space-between;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    overflow:hidden;
  }
  
  /* Views */
  .view{ flex:1; display:none; flex-direction:column; align-items:center; justify-content:center; padding: 20px; overflow-y:auto; }
  .view.active{ display:flex; }

  /* Player View */
  .disc-wrap{ width: 250px; height: 250px; position:relative; display:flex; align-items:center; justify-content:center; margin-bottom: 20px; }
  .disc{
    width: 240px; height: 240px; border-radius: 50%;
    background: repeating-radial-gradient(circle at center, #141210 0px, #141210 2px, #211D1A 3px, #211D1A 5px);
    display:flex; align-items:center; justify-content:center; animation: spin 8s linear infinite paused;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .disc.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .label{ width: 110px; height: 110px; border-radius: 50%; background: var(--accent); color: #120A04; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 10px; text-align:center; }
  .label-title{ font-weight:bold; font-size: 11px; max-height: 40px; overflow:hidden; }

  .track-info{ text-align:center; margin-bottom: 20px; width: 100%; }
  .track-title{ font-size: 18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-artist{ font-size: 13px; color: var(--text-dim); margin-top:4px; }

  .progress{ width: 100%; display:flex; align-items:center; gap: 10px; margin-bottom: 20px; }
  .bar{ flex:1; height: 6px; background: var(--line); border-radius:3px; position:relative; }
  .bar-fill{ position:absolute; left:0; top:0; bottom:0; background: var(--accent); border-radius:3px; width:0%; }
  .time{ font-size: 11px; font-family: monospace; color: var(--text-dim); }

  .controls{ display:flex; align-items:center; gap: 30px; }
  .btn-ctl{ background:none; border:none; color: var(--text); font-size: 24px; cursor:pointer; }
  .btn-play{ width: 64px; height: 64px; border-radius:50%; background: var(--accent); color:#120A04; font-size:26px; display:flex; align-items:center; justify-content:center; }

  /* Library View */
  .lib-header{ width: 100%; display:flex; justify-content:space-between; align-items:center; padding-bottom: 12px; border-bottom:1px solid var(--line); }
  .lib-title{ font-size: 20px; font-weight:bold; }
  .btn-add{ background: var(--accent); color:#120A04; border:none; padding: 8px 14px; border-radius: 16px; font-weight:600; font-size: 13px; }
  
  .list{ width:100%; flex:1; overflow-y:auto; margin-top: 10px; }
  .item{ display:flex; justify-content:space-between; align-items:center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item-title{ font-size: 14px; font-weight: 500; }
  .item-artist{ font-size: 12px; color: var(--text-dim); }

  /* Bottom iOS Tab Bar */
  .tab-bar{ height: 60px; background: var(--bg-panel); border-top: 1px solid var(--line); display:flex; justify-content:space-around; align-items:center; }
  .tab-item{ background:none; border:none; color: var(--text-dim); font-size: 11px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tab-item.active{ color: var(--accent); }
  .tab-icon{ font-size: 18px; }
</style>
</head>
<body>

<!-- Player Screen -->
<div class="view active" id="playerView">
  <div class="disc-wrap">
    <div class="disc" id="disc">
      <div class="label">
        <div class="label-title" id="discTitle">Groove</div>
      </div>
    </div>
  </div>
  <div class="track-info">
    <div class="track-title" id="trackTitle">No Track Selected</div>
    <div class="track-artist" id="trackArtist">Tap Library to add music</div>
  </div>
  <div class="progress">
    <span class="time" id="curTime">0:00</span>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <span class="time" id="durTime">0:00</span>
  </div>
  <div class="controls">
    <button class="btn-ctl" id="prevBtn">⏮</button>
    <button class="btn-ctl btn-play" id="playBtn">▶</button>
    <button class="btn-ctl" id="nextBtn">⏭</button>
  </div>
</div>

<!-- Library Screen -->
<div class="view" id="libraryView">
  <div class="lib-header">
    <div class="lib-title">Library</div>
    <button class="btn-add" onclick="document.getElementById('fileInput').click()">+ Add Music</button>
  </div>
  <input type="file" id="fileInput" multiple accept="audio/*" style="display:none">
  <div class="list" id="trackList"></div>
</div>

<!-- Bottom Navigation Bar -->
<div class="tab-bar">
  <button class="tab-item active" id="tabPlayer">
    <span class="tab-icon">🎵</span>
    <span>Player</span>
  </button>
  <button class="tab-item" id="tabLib">
    <span class="tab-icon">📚</span>
    <span>Library</span>
  </button>
</div>

<script>
  let db, library = [], currentIndex = -1;
  const audio = new Audio();
  
  // Initialize Storage
  const req = indexedDB.open('groove-mobile', 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore('tracks', {keyPath:'id'});
  req.onsuccess = e => { db = e.target.result; loadTracks(); };

  function loadTracks() {
    const tx = db.transaction('tracks', 'readonly');
    tx.objectStore('tracks').getAll().onsuccess = e => {
      library = e.target.result || [];
      renderLibrary();
    };
  }

  function renderLibrary() {
    const list = document.getElementById('trackList');
    list.innerHTML = library.length === 0 ? '<div style="padding:20px; text-align:center; color:var(--text-dim)">No tracks found. Tap "+ Add Music".</div>' : '';
    library.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `<div><div class="item-title">${item.title}</div><div class="item-artist">${item.artist}</div></div><div>▶</div>`;
      row.onclick = () => { playTrack(i); switchTab('player'); };
      list.appendChild(row);
    });
  }

  function playTrack(i) {
    if (i < 0 || i >= library.length) return;
    currentIndex = i;
    const item = library[i];
    audio.src = URL.createObjectURL(item.blob);
    audio.play();
    document.getElementById('trackTitle').textContent = item.title;
    document.getElementById('trackArtist').textContent = item.artist;
    document.getElementById('discTitle').textContent = item.title;
    document.getElementById('disc').classList.add('spinning');
    document.getElementById('playBtn').textContent = '⏸';
  }

  document.getElementById('playBtn').onclick = () => {
    if (currentIndex === -1 && library.length > 0) return playTrack(0);
    if (audio.paused) {
      audio.play();
      document.getElementById('disc').classList.add('spinning');
      document.getElementById('playBtn').textContent = '⏸';
    } else {
      audio.pause();
      document.getElementById('disc').classList.remove('spinning');
      document.getElementById('playBtn').textContent = '▶';
    }
  };

  document.getElementById('nextBtn').onclick = () => playTrack((currentIndex + 1) % library.length);
  document.getElementById('prevBtn').onclick = () => playTrack((currentIndex - 1 + library.length) % library.length);

  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    document.getElementById('barFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
    document.getElementById('curTime').textContent = formatTime(audio.currentTime);
    document.getElementById('durTime').textContent = formatTime(audio.duration);
  };

  function formatTime(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
  }

  // iOS File Handler Workaround
  document.getElementById('fileInput').onchange = async (e) => {
    for (let file of e.target.files) {
      const buffer = await file.arrayBuffer();
      const blob = new Blob([buffer], { type: file.type || 'audio/mpeg' });
      const parts = file.name.replace(/\.[^/.]+$/, "").split(" - ");
      const item = {
        id: Date.now() + Math.random(),
        title: parts[1] || parts[0],
        artist: parts[1] ? parts[0] : "Unknown",
        blob: blob
      };
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put(item);
    }
    setTimeout(loadTracks, 300);
  };

  // Tab navigation
  function switchTab(tab) {
    if (tab === 'player') {
      document.getElementById('playerView').classList.add('active');
      document.getElementById('libraryView').classList.remove('active');
      document.getElementById('tabPlayer').classList.add('active');
      document.getElementById('tabLib').classList.remove('active');
    } else {
      document.getElementById('libraryView').classList.add('active');
      document.getElementById('playerView').classList.remove('active');
      document.getElementById('tabLib').classList.add('active');
      document.getElementById('tabPlayer').classList.remove('active');
    }
  }

  document.getElementById('tabPlayer').onclick = () => switchTab('player');
  document.getElementById('tabLib').onclick = () => switchTab('library');
</script>
</body>
</html>
