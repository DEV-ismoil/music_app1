  // ---------- Drag to reorder (Pointer Events: works for mouse AND touch/iPhone) ----------
  let ptrDragId = null;
  let ptrDragEl = null;
  let ptrAutoScrollRAF = null;
  let ptrLastClientY = 0;

  trackListEl.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const row = handle.closest('.track-row');
    if(!row || row.dataset.draggable !== 'true') return;
    ptrDragId = row.dataset.id;
    ptrDragEl = row;
    row.classList.add('dragging');
    e.preventDefault();
  });

  // While dragging near the top/bottom edge of the (often short, on phones)
  // scrollable track list, keep auto-scrolling so you can drop onto a row
  // that isn't currently visible — same behavior as Files/Spotify's own lists.
  function autoScrollTick(){
    if(!ptrDragId){ ptrAutoScrollRAF = null; return; }
    const rect = trackListEl.getBoundingClientRect();
    const edge = 36;
    const distFromTop = ptrLastClientY - rect.top;
    const distFromBottom = rect.bottom - ptrLastClientY;
    if(distFromTop < edge && distFromTop > -20){
      trackListEl.scrollTop -= (edge - distFromTop) * 0.6;
    } else if(distFromBottom < edge && distFromBottom > -20){
      trackListEl.scrollTop += (edge - distFromBottom) * 0.6;
    }
    ptrAutoScrollRAF = requestAnimationFrame(autoScrollTick);
  }

  trackListEl.addEventListener('pointermove', (e) => {
    if(!ptrDragId) return;
    e.preventDefault();
    ptrLastClientY = e.clientY;
    if(!ptrAutoScrollRAF) ptrAutoScrollRAF = requestAnimationFrame(autoScrollTick);
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const overRow = target ? target.closest('.track-row') : null;
    document.querySelectorAll('.track-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    if(overRow && overRow.dataset.id !== ptrDragId){
      overRow.classList.add('drag-over');
    }
  });

  async function finishPointerDrag(e){
    if(!ptrDragId) return;
    if(ptrAutoScrollRAF){ cancelAnimationFrame(ptrAutoScrollRAF); ptrAutoScrollRAF = null; }
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const overRow = target ? target.closest('.track-row') : null;
    if(ptrDragEl) ptrDragEl.classList.remove('dragging');
    document.querySelectorAll('.track-row.drag-over').forEach(r => r.classList.remove('drag-over'));

    if(overRow && overRow.dataset.id !== ptrDragId){
      if(currentPlaylistId === null){
        const fromIdx = library.findIndex(t => t.id === ptrDragId);
        const toIdx = library.findIndex(t => t.id === overRow.dataset.id);
        if(fromIdx !== -1 && toIdx !== -1){
          const [moved] = library.splice(fromIdx, 1);
          library.splice(toIdx, 0, moved);
          for(let i = 0; i < library.length; i++){
            library[i].order = i;
            await dbPut(library[i]);
          }
          render();
        }
      } else {
        const pl = playlists.find(p => p.id === currentPlaylistId);
        if(pl){
          const fromIdx = pl.trackIds.indexOf(ptrDragId);
          const toIdx = pl.trackIds.indexOf(overRow.dataset.id);
          if(fromIdx !== -1 && toIdx !== -1){
            const [moved] = pl.trackIds.splice(fromIdx, 1);
            pl.trackIds.splice(toIdx, 0, moved);
            await dbPutPlaylist(pl);
            render();
          }
        }
      }
    }
    ptrDragId = null;
    ptrDragEl = null;
  }

  trackListEl.addEventListener('pointerup', finishPointerDrag);

    try {
      // 1. Convert file to ArrayBuffer FIRST outside DB transaction
      const buffer = await file.arrayBuffer();
      const blob = new Blob([buffer], { type: file.type || 'audio/mpeg' });

      const id = 'tr_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      const name = file.name.replace(/\.[^/.]+$/, '');
      const parts = name.split(' - ');

      const track = {
        id,
        title: parts.length > 1 ? parts[1] : name,
        artist: parts.length > 1 ? parts[0] : 'Unknown Artist',
        fileData: blob
      };

      // 2. Put into IndexedDB after conversion completes
      await dbPut(track);
    } catch (err) {
      console.error('Failed to process file on iOS:', err);
    }
  }

  async function addFiles(fileList){
    for(const file of fileList){
      if(!file.type.startsWith('audio/')) continue;
      let { artist, title } = guessArtistTitle(file.name);
      try{
        const tags = await extractId3Tags(file);
        if(tags.title) title = tags.title;
        if(tags.artist) artist = tags.artist;
      }catch(e){}

      const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,9);
      const order = library.length;
      const track = { id, name: file.name, artist, title, blob: file, duration: null, order, art: null, lyrics: null };

      library.push(track);
      render();
      await dbPut(track);

      const tempUrl = URL.createObjectURL(file);
      const tempAudio = new Audio(tempUrl);
      tempAudio.addEventListener('loadedmetadata', async () => {
        track.duration = tempAudio.duration;
        URL.revokeObjectURL(tempUrl);
        await dbPut(track);
        render();
      });

      extractAlbumArt(file).then(async (artBlob) => {
        if(artBlob){
          track.art = artBlob;
          await dbPut(track);
          if(library[currentIndex] && library[currentIndex].id === track.id){
            setDiscVisual(track);
          }
        }
      });

      extractLyrics(file).then(async (lyricsText) => {
        if(lyricsText){
          track.lyrics = lyricsText;
          await dbPut(track);
          if(library[currentIndex] && library[currentIndex].id === track.id){
            refreshLyricsPanel();
          }
        }
      });
    }
    fileInput.value = '';
  }

  async function removeTrack(id){
    if(currentPlaylistId !== null){
      // In a playlist view, the ✕ only removes membership, not the song itself.
      const pl = playlists.find(p => p.id === currentPlaylistId);
      if(pl){
        pl.trackIds = pl.trackIds.filter(tid => tid !== id);
        await dbPutPlaylist(pl);
      }
      render();
      return;
    }
    cancelCrossfade();
    const idx = libIndexOf(id);
    if(idx === -1) return;
    if(idx === currentIndex){
      audio.pause();
      audio.src = '';
      currentIndex = -1;
      npTitle.textContent = 'Nothing loaded yet';
      npArtist.textContent = 'ADD SOME MUSIC TO BEGIN';
      setDiscVisual(null);
    } else if(idx < currentIndex){
      currentIndex--;
    }
    library.splice(idx, 1);
    await dbDelete(id);
    // Keep playlists clean: strip the deleted track from any playlist referencing it.
    let touched = false;
    for(const pl of playlists){
      if(pl.trackIds.includes(id)){
        pl.trackIds = pl.trackIds.filter(tid => tid !== id);
        await dbPutPlaylist(pl);
        touched = true;
      }
    }
    render();
  }

    render();
  })();

  // Register the service worker only when actually served over http(s) —
  // this silently no-ops for the plain file:// version (desktop/exe), and
  // registers only in a hosted PWA context (see manifest.json / sw.js).
  // Only register a service worker when actually hosted on a real
  // http(s) site (the iPhone/web install). Skip entirely inside the
  // desktop exe (window.pywebview is only present there) and on plain
  // file:// — registering against a sw.js that isn't bundled there
  // would otherwise 404 and could stall page load in some WebView builds.
  if(!window.pywebview && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

})();
</script>
</body>
</html>
